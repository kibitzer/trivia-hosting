name: Deploy Static Content to Pages

on:
    push:
        branches: ['main']
        paths:
            - 'host/**'
            - 'shared/**'
            - 'config/**'
            - 'player.html'
            - 'player-alpine.js'
            - 'manifest.json'
            - 'sw.js'
            - 'package.json'
            - 'package-lock.json'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Pages
              uses: actions/configure-pages@v5
            - name: Remove non-deployment directories
              run: rm -rf reviews tests docs playwright-report test-results
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  # Upload entire repository
                  path: '.'
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
