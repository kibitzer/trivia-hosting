name: CI - Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
  contents: read

jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Get Playwright version
              id: playwright-version
              run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_OUTPUT

            - name: Cache Playwright Browsers
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright Browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps

            - name: Install Playwright system dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps

            - name: Lint Code
              run: npm run lint

            - name: Run Unit Tests
              run: npm test -- --run

            - name: Run E2E Tests
              env:
                  TRIVIA_TEST_EMAIL: ${{ secrets.TRIVIA_TEST_EMAIL }}
                  TRIVIA_TEST_PASSWORD: ${{ secrets.TRIVIA_TEST_PASSWORD }}
                  CI: true
              run: npm run test:e2e

            - name: Upload Playwright Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
