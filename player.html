<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trivia Night - Play!</title>

        <link
            rel="apple-touch-icon"
            href="https://cdn-icons-png.flaticon.com/512/3407/3407024.png"
        />

        <!-- Shared Head Helper (Dependencies) -->
        <script src="shared/head-helper.js"></script>

    <style>
        .player-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Join Screen */
        .join-hero {
            text-align: center;
            padding: 3rem 1rem;
        }
        .join-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        /* Player Header */
        .player-status-bar {
            background: var(--color-primary);
            color: white;
            padding: 1rem 1.25rem;
            border-radius: var(--radius-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-md);
        }
        .streak-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 800;
            margin-left: 0.5rem;
        }

        /* Waiting Screen */
        .waiting-hero {
            text-align: center;
            padding: 4rem 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .waiting-icon {
            font-size: 4rem;
            margin-bottom: 2rem;
            animation: pulse 2s infinite;
        }

        /* Question View */
        .question-text {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            line-height: 1.3;
            color: var(--color-text);
        }
        .question-image-container {
            width: 100%;
            max-height: 250px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 1.5rem;
            background: white;
            border: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .question-image {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
        }

        /* Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .option-btn {
            background: white;
            padding: 1rem 1.25rem;
            border-radius: var(--radius-lg);
            font-size: 1rem;
            font-weight: 700;
            color: var(--color-text);
            text-align: left;
            border: 2px solid var(--color-border);
            width: 100%;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--color-primary);
            background: var(--color-primary-light);
        }
        .option-btn.selected {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
            box-shadow: var(--shadow-md);
        }
        .option-btn.correct {
            background: var(--color-success-bg);
            color: var(--color-success);
            border-color: var(--color-success);
        }
        .option-btn.incorrect {
            background: var(--color-danger-bg);
            color: var(--color-danger);
            border-color: var(--color-danger);
        }

        /* Feedback Flash Overlay */
        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .feedback-overlay.active {
            opacity: 1;
        }
        .feedback-overlay.correct {
            background: rgba(22, 163, 74, 0.85);
        }
        .feedback-overlay.incorrect {
            background: rgba(220, 38, 38, 0.85);
        }
        .feedback-content {
            color: white;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .feedback-overlay.active .feedback-content {
            transform: scale(1);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body x-data="triviaPlayer">
    <!-- Connectivity Overlay -->
    <div x-html="TriviaUI.connectivityOverlay()"></div>

    <!-- Feedback Flash -->
    <div
        class="feedback-overlay"
        :class="{'active': showFeedback, 'correct': isCorrect, 'incorrect': !isCorrect}"
        x-show="showFeedback"
        x-cloak
    >
        <div class="feedback-content">
            <h1 style="color: white; font-size: 3.5rem; margin-bottom: 1rem;" x-text="isCorrect ? '✅ CORRECT!' : '❌ WRONG'"></h1>
            <div style="font-size: 6rem" x-text="isCorrect ? '🎉' : '😢'"></div>
            <template x-if="isCorrect && streak >= 3">
                <div style="font-size: 2.5rem; font-weight: 900; margin-top: 1.5rem; text-shadow: 0 4px 10px rgba(0,0,0,0.3)">
                    🔥 <span x-text="streak"></span> STREAK!
                </div>
            </template>
        </div>
    </div>

    <div class="player-container">
        <!-- Join Section -->
        <div class="card" x-show="screen === 'join'" style="margin-top: auto; margin-bottom: auto;">
            <div class="join-hero">
                <span class="join-icon">🎯</span>
                <h1 style="font-size: 2.25rem; margin-bottom: 0.5rem">Trivia Night</h1>
                <p class="text-muted" style="margin-bottom: 2.5rem; font-weight: 600;">Ready to show off your knowledge?</p>

                <div
                    x-show="errorMsg"
                    class="mb-4"
                    style="
                        color: var(--color-danger);
                        background: var(--color-danger-bg);
                        padding: 1rem;
                        border-radius: var(--radius-md);
                        font-weight: 700;
                        border: 1px solid var(--color-danger);
                    "
                    x-text="errorMsg"
                ></div>

                <div class="flex-col gap-4">
                    <input
                        type="text"
                        x-model="playerName"
                        placeholder="Enter your name..."
                        maxlength="20"
                        style="font-size: 1.125rem; padding: 1rem; text-align: center;"
                        @keyup.enter="joinGame()"
                        :disabled="!!errorMsg"
                    />
                    <button class="btn btn-primary" style="font-size: 1.25rem; padding: 1rem;" @click="joinGame()" :disabled="!!errorMsg">
                        Join Game 🎉
                    </button>
                </div>
            </div>
        </div>

        <!-- Game Section -->
        <div x-show="screen === 'game'" class="flex-col" style="flex: 1;">
            <div 
                :key="currentItem.currentIndex" 
                x-transition:enter="fade-enter-active" 
                x-transition:enter-start="fade-enter-from" 
                x-transition:enter-end="fade-enter-to"
                x-show="!gameState.showScoreboard"
                class="flex-col"
                style="flex: 1;"
            >
                <div class="player-status-bar">
                    <div class="flex items-center">
                        <span style="font-weight: 800; font-size: 1.25rem" x-text="playerName"></span>
                        <template x-if="streak >= 3">
                            <span class="streak-badge" x-text="'🔥 ' + streak"></span>
                        </template>
                    </div>
                    <div class="flex items-center gap-2">
                        <span style="font-weight: 900; font-size: 1.25rem" x-text="score"></span>
                        <span class="text-xs font-extrabold" style="opacity: 0.8; letter-spacing: 0.05em;">PTS</span>
                    </div>
                </div>

                <!-- WAITING SCREEN -->
                <div class="waiting-hero" x-show="isWaiting">
                    <div class="waiting-icon">⏳</div>
                    <h2 style="font-size: 2rem; margin-bottom: 0.75rem">Waiting for Host</h2>
                    <p class="text-muted text-lg" style="font-weight: 600;">The next round will begin shortly. Get ready!</p>
                </div>

                <!-- ROUND TITLE -->
                <template x-if="currentItem.type === 'round-title'">
                    <div class="slide-card" x-transition:enter="fade-enter-active" x-transition:enter-start="fade-enter-from" x-transition:enter-end="fade-enter-to">
                        <template x-if="currentItem.image">
                            <div class="slide-card-bg" :style="`background-image: url('${currentItem.image}')`"></div>
                        </template>
                        <div class="slide-card-content">
                            <div class="text-sm font-extrabold" style="opacity: 0.9; letter-spacing: 0.2em; margin-bottom: 1rem;">
                                ROUND <span x-text="currentItem.roundNumber"></span>
                            </div>
                            <h2 x-text="currentItem.roundTitle"></h2>
                        </div>
                    </div>
                </template>

                <!-- QUESTION DISPLAY -->
                <div x-show="currentItem.type === 'question'" class="flex-col" style="flex: 1;">
                    <div class="card" style="flex: 1; display: flex; flex-direction: column;">
                        <div class="question-header">
                            <div class="flex items-center gap-2">
                                <span class="question-number">Q<span x-text="currentItem.questionNumber"></span></span>
                                <template x-if="currentItem.rebusImages">
                                    <span class="text-xs font-extrabold" style="background: var(--color-primary); color: white; padding: 0.2rem 0.6rem; border-radius: var(--radius-full);">REBUS</span>
                                </template>
                            </div>
                            <div x-html="TriviaUI.timer()"></div>
                        </div>

                        <div class="question-text" x-html="currentItem.questionText"></div>

                        <template x-if="currentItem.questionImage">
                            <div class="question-image-container">
                                <img :src="currentItem.questionImage" class="question-image" onerror="this.parentElement.style.display = 'none'" />
                            </div>
                        </template>

                        <template x-if="currentItem.rebusImages && currentItem.rebusImages.length > 0">
                            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1.5rem;">
                                <template x-for="(img, idx) in currentItem.rebusImages" :key="idx">
                                    <div style="aspect-ratio: 1; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--color-border); position: relative; background: white;">
                                        <img :src="img" style="width: 100%; height: 100%; object-fit: cover;" />
                                        <div style="position: absolute; bottom: 0.4rem; left: 0.4rem; background: rgba(0,0,0,0.6); color: white; padding: 0.1rem 0.4rem; border-radius: 4px; font-weight: 800; font-size: 0.75rem;" x-text="idx + 1"></div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- VIEW: Multiple Choice -->
                        <div class="options-list" x-show="currentItem.questionType === 'MC' && timerStatus !== 'countdown'">
                            <template x-for="opt in currentItem.options">
                                <button
                                    class="option-btn"
                                    x-html="opt"
                                    :class="{
                                        'selected': currentAnswer === opt,
                                        'correct': isCorrectOption(opt),
                                        'incorrect': isMyWrongOption(opt)
                                    }"
                                    :disabled="hasSubmitted || timerStatus === 'revealed'"
                                    @click="selectOption(opt)"
                                ></button>
                            </template>
                        </div>

                        <!-- VIEW: Short Answer -->
                        <div x-show="currentItem.questionType === 'SHORT' && timerStatus !== 'countdown' && !hasSubmitted && !gameState.answerRevealed" class="flex-col gap-4">
                            <input
                                type="text"
                                x-model="currentAnswer"
                                placeholder="Type your answer..."
                                style="font-size: 1.125rem; padding: 1rem;"
                                @keyup.enter="submitShortAnswer()"
                            />
                            <button class="btn btn-primary" style="padding: 1rem; font-size: 1.125rem;" @click="submitShortAnswer()">Submit Answer</button>
                        </div>

                        <!-- Submitted Feedback -->
                        <div class="card" x-show="hasSubmitted && !gameState.answerRevealed" style="background: var(--color-primary-light); border-color: var(--color-primary); text-align: center; padding: 1.25rem; margin-top: auto;">
                            <p style="font-weight: 800; color: var(--color-primary); font-size: 1.125rem; margin-bottom: 0.25rem;">✅ Locked In!</p>
                            <p class="text-sm font-bold text-muted" x-text="'Your answer: ' + currentAnswer"></p>
                        </div>

                        <!-- Answer Reveal -->
                        <div x-show="gameState.answerRevealed" style="margin-top: auto;">
                            <div class="card" style="background: var(--color-success-bg); border: 2px solid var(--color-success); text-align: center; padding: 1.5rem; margin-bottom: 0;">
                                <h3 style="color: var(--color-success); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem;">Correct Answer</h3>
                                <div style="font-size: 2rem; color: var(--color-success); font-weight: 900; line-height: 1.2;" x-text="gameState.answer || '---'"></div>
                            </div>
                            <div x-show="currentItem.questionType === 'SHORT' && currentAnswer" class="text-center mt-4">
                                <span class="text-sm font-bold text-muted">You guessed: </span>
                                <span class="text-sm font-extrabold" x-text="currentAnswer"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Scoreboard -->
            <div class="card" x-show="gameState.showScoreboard" style="flex: 1;">
                <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center;">🏆 Leaderboard</h2>
                <div class="score-list">
                    <template x-for="(player, index) in scoreboard" :key="player.id">
                        <div class="score-item" :class="{'leader': index === 0 && player.score > 0, 'me': player.isMe}">
                            <div class="score-item-name">
                                <span x-show="index === 0 && player.score > 0" style="margin-right: 0.5rem;">👑</span>
                                <span x-text="player.name + (player.isMe ? ' (You)' : '')"></span>
                            </div>
                            <span class="score-item-score" x-text="player.score"></span>
                        </div>
                    </template>
                </div>
                <div x-show="scoreboard.length === 0" class="waiting-hero" style="padding: 2rem;">
                    <p class="text-muted font-bold">No scores recorded yet.</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center py-4 mt-auto">
            <span class="text-xs font-extrabold text-muted" style="letter-spacing: 0.1em;" x-text="'TRIVIA PLAYER v' + appVersion"></span>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="player-alpine.js?v=1.3"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // Version handled by Alpine appVersion
            });

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    // Unregister SW on localhost to prevent caching/redirection issues during dev
                    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        navigator.serviceWorker.getRegistrations().then(registrations => {
                            for (let registration of registrations) {
                                registration.unregister();
                                console.log('Service Worker unregistered on localhost');
                            }
                        });
                    } else {
                        navigator.serviceWorker
                            .register('./sw.js')
                            .then((reg) => console.log('SW registered'))
                            .catch((err) => console.log('SW registration failed', err));
                    }
                });
            }
        </script>
    </body>
</html>
