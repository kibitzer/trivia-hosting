<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Question Browser - Trivia Night</title>

        <!-- Shared Head Helper (Dependencies) -->
        <script src="../shared/head-helper.js"></script>

        <style>
        .browser-layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            min-height: 100vh;
        }
        .sidebar-nav {
            background: var(--color-surface);
            border-right: 1px solid var(--color-border);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            color: var(--color-text-muted);
            font-weight: 700;
            transition: var(--transition);
            text-decoration: none !important;
            font-size: 0.875rem;
        }
        .nav-item:hover {
            background: var(--color-bg);
            color: var(--color-primary);
        }
        .nav-item.active {
            background: var(--color-primary-light);
            color: var(--color-primary);
        }

        .main-workspace {
            padding: 2.5rem;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Question Cards */
        .question-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .question-card {
            transition: var(--transition);
        }
        .question-card:hover {
            border-color: var(--color-primary);
            box-shadow: var(--shadow-md);
        }
        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-type { background: var(--color-primary-light); color: var(--color-primary); }
        .badge-difficulty { background: var(--color-bg); color: var(--color-secondary); }

        /* Filter Section */
        .filters-panel {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .tag-pill {
            display: inline-block;
            padding: 0.375rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.8125rem;
            font-weight: 700;
            background: var(--color-bg);
            color: var(--color-secondary);
            cursor: pointer;
            border: 1px solid transparent;
            margin: 0.125rem;
            transition: var(--transition);
        }
        .tag-pill:hover {
            background: var(--color-border);
        }
        .tag-pill.active {
            background: var(--color-primary);
            color: white;
        }
    </style>
</head>
<body x-data="questionBrowser">
    <div class="browser-layout" x-cloak>
        <!-- Sidebar Navigation (Same as Dashboard) -->
        <aside class="sidebar-nav">
            <div style="padding-left: 1rem; margin-bottom: 1rem;">
                <h1 style="font-size: 1.5rem; color: var(--color-primary);">🎯 Trivia</h1>
            </div>

            <nav class="nav-group">
                <a href="dashboard.html" class="nav-item">
                    <span>🏠</span> Dashboard
                </a>
                <a href="browser.html" class="nav-item active">
                    <span>📂</span> Question Bank
                </a>
            </nav>

            <div style="margin-top: auto;" class="nav-group">
                <div class="nav-item" style="cursor: default; opacity: 0.7;">
                    <span x-text="'v' + appVersion"></span>
                </div>
                <button @click="backToDashboard()" class="nav-item" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer;">
                    <span>🚪</span> Exit Bank
                </button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-workspace">
            <div x-show="waitingForAuth" style="text-align: center; padding: 4rem;">
                <div style="font-size: 3rem; margin-bottom: 1rem; animation: pulse 1.5s infinite;">⏳</div>
                <p class="text-muted">Verifying Authentication...</p>
            </div>

            <div x-show="!waitingForAuth" class="flex-col gap-8">
                <!-- Search & Filters Header -->
                <div class="flex-col gap-6">
                    <h2 style="font-size: 2.25rem;">Question Bank</h2>
                    
                    <div style="display: grid; grid-template-columns: 1fr 320px; gap: 1.5rem; align-items: start;">
                        <!-- Search Bar -->
                        <div class="flex-col gap-4">
                            <input 
                                type="text" 
                                x-model="searchQuery" 
                                placeholder="Search by text or tags..." 
                                style="font-size: 1.125rem; padding: 1rem 1.5rem; box-shadow: var(--shadow-md);"
                            >
                            
                            <div class="question-grid">
                                <template x-for="q in paginatedQuestions" :key="q.id">
                                    <div class="card question-card">
                                        <div class="flex justify-between items-start mb-4">
                                            <div class="flex gap-2">
                                                <span class="badge badge-type" x-text="q.type"></span>
                                                <span class="badge badge-difficulty" x-text="q.difficulty"></span>
                                            </div>
                                            <button @click="deleteQuestion(q.id)" class="text-muted hover:text-danger" style="background: none; border: none; cursor: pointer;">🗑️</button>
                                        </div>
                                        <div class="text-lg font-bold mb-4" x-html="q.question"></div>
                                        
                                        <template x-if="q.type === 'multiple'">
                                            <div class="grid mb-4" style="grid-template-columns: 1fr 1fr; background: var(--color-bg); padding: 1rem; border-radius: var(--radius-md); gap: 0.5rem;">
                                                <template x-for="opt in (q.options || [])" :key="opt">
                                                    <div class="text-sm font-bold" :class="opt === q.correctAnswer ? 'text-success' : 'text-muted'">
                                                        <span x-text="opt === q.correctAnswer ? '✓ ' : '• '"></span>
                                                        <span x-html="opt"></span>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <template x-if="q.type !== 'multiple'">
                                            <div class="text-sm font-bold mb-4">
                                                <span class="text-muted">Answer: </span>
                                                <span class="text-success" x-html="Array.isArray(q.correctAnswer) ? q.correctAnswer.join(', ') : q.correctAnswer"></span>
                                            </div>
                                        </template>

                                        <div class="flex flex-wrap gap-1">
                                            <template x-for="tag in (q.tags || [])" :key="tag">
                                                <span class="text-xs font-bold text-primary" x-text="'#' + tag"></span>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <div x-show="filteredQuestions.length === 0" class="card text-center" style="padding: 5rem 2rem;">
                                    <div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
                                    <h3 class="mb-2">No questions found</h3>
                                    <p class="text-muted">Try adjusting your filters or search terms.</p>
                                </div>
                            </div>

                            <!-- Pagination -->
                            <div x-show="filteredQuestions.length > 0" class="card flex justify-between items-center" style="padding: 1rem 1.5rem;">
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-bold text-muted">Rows per page:</span>
                                    <select :value="pageSize" @change="setPageSize($event.target.value)" style="width: 80px; padding: 0.25rem;">
                                        <option value="10">10</option>
                                        <option value="25">25</option>
                                        <option value="50">50</option>
                                    </select>
                                </div>
                                <div class="text-sm font-extrabold text-muted">
                                    <span x-text="startIndex"></span> - <span x-text="endIndex"></span> of <span x-text="filteredQuestions.length"></span>
                                </div>
                                <div class="flex gap-2">
                                    <button @click="prevPage()" :disabled="currentPage === 1" class="btn btn-secondary btn-sm">Prev</button>
                                    <button @click="nextPage()" :disabled="currentPage === totalPages" class="btn btn-secondary btn-sm">Next</button>
                                </div>
                            </div>
                        </div>

                        <!-- Sidebar Filters -->
                        <aside class="filters-panel">
                            <div class="flex-col gap-2">
                                <label class="text-xs font-extrabold text-muted">DIFFICULTY</label>
                                <select x-model="selectedDifficulty">
                                    <option value="All">All Difficulties</option>
                                    <option value="Easy">Easy</option>
                                    <option value="Medium">Medium</option>
                                    <option value="Hard">Hard</option>
                                </select>
                            </div>

                            <div class="flex-col gap-2">
                                <label class="text-xs font-extrabold text-muted">QUESTION TYPE</label>
                                <select x-model="selectedType">
                                    <option value="All">All Types</option>
                                    <option value="multiple">Multiple Choice</option>
                                    <option value="short">Short Answer</option>
                                    <option value="rebus">Rebus</option>
                                    <option value="true-false">True / False</option>
                                    <option value="identify">Identify Image</option>
                                </select>
                            </div>

                            <div class="flex-col gap-3">
                                <label class="text-xs font-extrabold text-muted">FILTER BY TAG</label>
                                <div class="flex flex-wrap gap-1">
                                    <template x-for="tag in allTags" :key="tag">
                                        <span class="tag-pill" :class="{ 'active': selectedTags.includes(tag) }" @click="toggleTag(tag)" x-text="tag"></span>
                                    </template>
                                </div>
                            </div>

                            <button @click="selectedDifficulty = 'All'; selectedType = 'All'; selectedTags = []; searchQuery = ''" class="btn btn-secondary btn-sm w-full" style="width: 100%;">Clear All Filters</button>
                        </aside>
                    </div>
                </div>
            </div>
        </main>
    </div>
        <script src="browser-data.js"></script>
        <script>
            document.addEventListener('alpine:init', () => {
                const fb = TriviaFirebase.init();
                if (fb) {
                    TriviaDataService.init(fb.db);
                    Alpine.data('questionBrowser', () => 
                        window.createBrowserData(fb.firebase, fb.db, fb.auth)
                    );
                }
            });
        </script>
    </body>
</html>
