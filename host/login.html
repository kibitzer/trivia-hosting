<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Trivia Night</title>
    <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
    <link rel="stylesheet" href="../shared/styles.css?v=1.6">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--color-bg);
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
        }
    </style>
</head>
<body x-data="loginHandler">
    <div class="card login-card" x-cloak>
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="margin-bottom: 0.5rem;">Host Login</h1>
            <p class="text-muted">Enter your credentials to manage quizzes.</p>
        </div>

        <form @submit.prevent="login">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" x-model="email" required placeholder="host@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" x-model="password" required placeholder="••••••••">
            </div>

            <div x-show="errorMsg" class="text-sm" style="color: var(--color-danger); background: #fef2f2; padding: 0.75rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-weight: 600;" x-text="errorMsg"></div>

            <button type="submit" class="btn btn-primary" style="width: 100%;" :disabled="loading">
                <span x-show="!loading">Login to Dashboard</span>
                <span x-show="loading">Authenticating...</span>
            </button>
        </form>

        <div style="margin-top: 2rem; text-align: center; border-top: 1px solid var(--color-border); padding-top: 1.5rem;">
            <a href="host.html" class="text-sm font-weight-bold" style="color: var(--color-primary); text-decoration: none;">← Back to Player View</a>
        </div>
        
        <div style="text-align: center; margin-top: 1rem;">
            <span class="text-muted" style="font-size: 0.75rem; font-weight: 700;" x-text="'v' + appVersion"></span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../shared/version.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-performance-compat.js"></script>
    <script src="../config/firebase-config.js"></script>
    <script src="../shared/firebase-helper.js"></script>
    
    <script>
        document.addEventListener('alpine:init', () => {
            const fb = TriviaFirebase.init();
            if (!fb) return;
            
            Alpine.data('loginHandler', () => ({
                email: '',
                password: '',
                loading: false,
                errorMsg: '',
                appVersion: window.TRIVIA_VERSION || '0.0.0',

                init() {
                    fb.auth.onAuthStateChanged(user => {
                        if (user && !user.isAnonymous) {
                            const urlParams = new URLSearchParams(window.location.search);
                            const rawRedirect = urlParams.get('redirect') || 'dashboard.html';
                            // Security: Only allow redirection to specific local dashboard/editor pages
                            // Support both extensionless (clean URLs) and .html versions
                            const allowedPages = ['dashboard', 'editor', 'host', 'dashboard.html', 'editor.html', 'host.html'];
                            
                            let safeRedirect = 'dashboard.html';
                            try {
                                // Use URL API to safely validate the redirect target
                                const url = new URL(rawRedirect, window.location.href);
                                
                                // Security checks
                                const isSameOrigin = url.origin === window.location.origin;
                                const isSafeProtocol = url.protocol === 'http:' || url.protocol === 'https:';
                                
                                // Extract the page name from the path, handling various structures
                                // e.g., /host/editor.html -> editor.html
                                // e.g., /host/editor -> editor
                                // e.g., /editor -> editor
                                const pathParts = url.pathname.split('/').filter(p => p);
                                const lastPart = pathParts.pop() || '';
                                
                                console.log('[Login] Validating redirect:', {
                                    raw: rawRedirect,
                                    resolved: url.href,
                                    isSameOrigin,
                                    isSafeProtocol,
                                    lastPart
                                });

                                if (isSameOrigin && isSafeProtocol && allowedPages.includes(lastPart)) {
                                    // Use the sanitized href from the URL object to preserve query params
                                    safeRedirect = url.href;
                                } else {
                                    console.warn('[Login] Redirect validation failed or unauthorized, defaulting to dashboard');
                                }
                            } catch (e) {
                                console.error('[Login] Redirect parsing error:', e);
                            }
                            
                            window.location.replace(safeRedirect);
                        }
                    });
                },

                async login() {
                    this.loading = true;
                    this.errorMsg = '';
                    try {
                        await fb.auth.signInWithEmailAndPassword(this.email, this.password);
                    } catch (e) {
                        this.errorMsg = e.message;
                        this.loading = false;
                    }
                }
            }));
        });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
