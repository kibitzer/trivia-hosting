<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trivia Host Control Panel</title>
        <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
        <link rel="manifest" href="../manifest.json" />
        <meta name="theme-color" content="#1565c0" />

        <!-- Cache Busting for CSS -->
        <link rel="stylesheet" href="../shared/styles.css?v=1.6" />
        <style>
            .container {
                max-width: 1200px;
                margin: 2rem auto;
                display: grid;
                grid-template-columns: 1fr 340px;
                gap: 1.5rem;
                padding: 0 1rem;
            }
            .sidebar {
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
            }
            .header {
                text-align: center;
                margin-bottom: 2rem;
                padding-bottom: 1.5rem;
                border-bottom: 1px solid var(--color-border);
            }
            .header h1 {
                font-size: 2.25rem;
                margin-bottom: 0.5rem;
            }
            .quiz-selector {
                background: var(--color-bg);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                padding: 1rem;
                display: flex;
                gap: 0.75rem;
                align-items: center;
                flex-wrap: wrap;
                margin-bottom: 1.5rem;
            }
            .round-title-slide {
                background: var(--color-primary);
                color: white;
                text-align: center;
                padding: 3rem;
                border-radius: var(--radius-lg);
                min-height: 320px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                position: relative;
                overflow: hidden;
            }
            .round-title-bg {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-size: cover;
                background-position: center;
                opacity: 0.15;
            }
            .round-title-content {
                position: relative;
                z-index: 2;
            }
            .round-title-slide h2 {
                color: white;
                font-size: 2.5rem;
            }
            .question-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 1.5rem;
            }
            .question-number {
                background: var(--color-primary);
                color: white;
                padding: 0.25rem 1rem;
                border-radius: var(--radius-full);
                font-size: 0.875rem;
                font-weight: 700;
            }
            .timer-display {
                font-size: 4rem;
                text-align: center;
                font-weight: 800;
                color: var(--color-primary);
                margin: 1.5rem 0;
                line-height: 1;
            }
            .timer-display.countdown {
                color: var(--color-warning);
            }
            .timer-display.danger {
                color: var(--color-danger);
                animation: pulse 0.5s infinite;
            }
            .question-text {
                font-size: 1.75rem;
                font-weight: 700;
                margin-bottom: 1.5rem;
                line-height: 1.3;
            }
            .question-image {
                max-height: 280px;
                width: 100%;
                object-fit: contain;
                border-radius: var(--radius-md);
                margin-bottom: 1.5rem;
                background: var(--color-bg);
            }
            .options-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
                margin-bottom: 1.5rem;
            }
            .option {
                background: var(--color-bg);
                padding: 1rem;
                border-radius: var(--radius-md);
                border: 1px solid var(--color-border);
                font-weight: 600;
            }
            .option.correct {
                background: #f0fdf4;
                color: var(--color-success);
                border-color: var(--color-success);
            }
            .answer-box {
                background: #f0fdf4;
                border: 2px solid var(--color-success);
                padding: 1.5rem;
                border-radius: var(--radius-lg);
                text-align: center;
                margin-top: 1.5rem;
            }
            .host-notes {
                background: #fff7ed;
                border-left: 4px solid var(--color-warning);
                padding: 1rem;
                margin-top: 1.5rem;
                border-radius: 0 var(--radius-md) var(--radius-md) 0;
            }
            .scroll-list {
                max-height: 300px;
                overflow-y: auto;
            }
            .list-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.75rem;
                border-bottom: 1px solid var(--color-border);
            }
            .list-row.leader {
                background: #fefce8;
            }
            .progress-bar {
                height: 6px;
                background: var(--color-border);
                border-radius: var(--radius-full);
                overflow: hidden;
                margin-top: 0.75rem;
            }
            .progress-fill {
                height: 100%;
                background: var(--color-primary);
                transition: width 0.3s;
            }
            @keyframes pulse {
                0%,
                100% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.02);
                }
            }
        </style>
    </head>

    <body x-data="triviaHost">
        <!-- Connectivity Overlay -->
        <div x-html="TriviaUI.connectivityOverlay()"></div>

        <div class="container">
            <div class="card main-panel">
                <div class="header">
                    <h1>🎯 Trivia Night</h1>
                    <p class="text-muted">Host Control Panel</p>
                    <div
                        style="
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            gap: 1rem;
                            margin-top: 1rem;
                        "
                    >
                        <div x-html="TriviaUI.connectionStatus()"></div>
                        <a href="dashboard.html" class="btn btn-secondary text-sm" style="text-decoration: none">Dashboard</a>
                        <button
                            x-show="isAuthenticated"
                            @click="logout()"
                            class="btn btn-secondary text-sm"
                        >
                            Logout
                        </button>
                    </div>
                </div>

                <!-- VIEW: Loading/Redirecting -->
                <div x-show="loading || !quizData.length" style="text-align: center; padding: 4rem">
                    <div class="timer-display">⏳</div>
                    <p class="text-muted" x-text="loading ? 'Loading Quiz...' : 'Preparing Host Panel...'"></p>
                </div>

                <!-- VIEW: Setup/Lobby -->
                <div x-show="isAuthenticated && currentView === 'setup' && quizData.length > 0">
                    <div x-show="errorMsg" style="color: var(--color-danger); background: #fef2f2; padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; font-weight: 600;" x-text="errorMsg"></div>
                    <div x-show="successMsg" style="color: var(--color-success); background: #f0fdf4; padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; font-weight: 600;" x-text="successMsg"></div>
                    
                    <div style="text-align: center; padding: 2rem">
                        <h2 style="font-size: 2rem; margin-bottom: 0.5rem">Ready to Start!</h2>
                        <p class="text-muted" style="margin-bottom: 2rem">
                            <strong x-text="quizData.length"></strong> items loaded &bull; 
                            <strong x-text="playerCount"></strong> players connected.
                        </p>
                        <button
                            class="btn btn-primary"
                            style="font-size: 1.25rem; padding: 1rem 3rem"
                            @click="startGame()"
                        >
                            🚀 Start Game
                        </button>
                    </div>
                </div>

                <!-- VIEW: Settings -->
                <!-- Removed: Settings now handled in Editor -->

                <!-- VIEW: Game -->
                <div x-show="isAuthenticated && currentView === 'game'">
                    <div :key="currentIndex" x-transition:enter="fade-enter-active" x-transition:enter-start="fade-enter" x-transition:enter-end="fade-enter-to">
                        <div class="text-muted text-sm" style="text-align: center; font-weight: 600">
                            ITEM <span x-text="currentIndex + 1"></span> OF
                            <span x-text="quizData.length"></span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" :style="`width: ${progressPercent}%`"></div>
                        </div>
                        <br />
                        <template x-if="currentItem && currentItem.type === 'round-title'">
                            <div class="round-title-slide" x-transition:enter="fade-enter-active" x-transition:enter-start="fade-enter" x-transition:enter-end="fade-enter-to">
                                <template x-if="currentItem.image">
                                    <div
                                        class="round-title-bg"
                                        :style="`background-image: url('${currentItem.image}')`"
                                    ></div>
                                </template>
                                <div class="round-title-content">
                                    <div style="opacity: 0.8; font-size: 1.1rem; font-weight: 800; letter-spacing: 0.1em">
                                        ROUND <span x-text="currentItem.roundNumber"></span>
                                    </div>
                                    <h2 x-text="currentItem.title" style="margin-top: 0.5rem"></h2>
                                </div>
                            </div>
                        </template>
                        <template x-if="currentItem && currentItem.type === 'question'">
                            <div x-transition:enter="fade-enter-active" x-transition:enter-start="fade-enter" x-transition:enter-end="fade-enter-to">
                                <div class="question-header">
                                    <span class="question-number"
                                        >QUESTION <span x-text="currentItem.questionNumber"></span
                                    ></span>
                                    <span
                                        class="text-muted text-sm"
                                        style="font-weight: 700"
                                        x-text="currentItem.questionType === 'MC' ? 'MULTIPLE CHOICE' : 'SHORT ANSWER'"
                                    ></span>
                                </div>
                                <div x-html="TriviaUI.timer()"></div>
                                <h2 class="question-text" x-text="currentItem.text"></h2>
                                <template x-if="currentItem.image">
                                    <img
                                        :src="currentItem.image"
                                        class="question-image"
                                        onerror="this.style.display = 'none'"
                                    />
                                </template>
                                <template x-if="currentItem.questionType === 'MC'">
                                    <div class="options-grid" x-show="timerStatus !== 'countdown'">
                                        <template x-for="opt in currentItem.options">
                                            <div
                                                class="option"
                                                x-text="opt"
                                                :class="{ 'correct': answerRevealed && currentItem.answer.includes(opt) }"
                                            ></div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="currentItem.questionType === 'SHORT'">
                                    <div
                                        class="text-muted"
                                        x-show="timerStatus !== 'countdown'"
                                        style="
                                            text-align: center;
                                            padding: 1.5rem;
                                            background: var(--color-bg);
                                            border-radius: var(--radius-md);
                                            margin-bottom: 1.5rem;
                                            font-weight: 600;
                                        "
                                    >
                                        📝 Short Answer Question
                                    </div>
                                </template>
                                <div class="answer-box" x-show="answerRevealed">
                                    <h3 style="color: var(--color-success); font-size: 1rem; margin-bottom: 0.5rem">✅ CORRECT ANSWER</h3>
                                    <div
                                        style="font-size: 2.25rem; font-weight: 800; color: var(--color-success)"
                                        x-text="currentItem.answer"
                                    ></div>
                                </div>
                                <div class="host-notes" x-show="currentItem.notes && answerRevealed">
                                    <h4 style="font-size: 0.875rem; margin-bottom: 0.25rem">🔒 HOST NOTES</h4>
                                    <p class="text-sm" x-text="currentItem.notes"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div
                        style="
                            margin-top: 2rem;
                            display: flex;
                            gap: 0.75rem;
                            flex-wrap: wrap;
                            justify-content: center;
                        "
                    >
                        <button
                            class="btn btn-primary"
                            style="background: var(--color-warning)"
                            @click="stopTimer()"
                            x-show="timerStatus === 'running' || timerStatus === 'countdown'"
                        >
                            ⏯️ Skip Timer
                        </button>
                        <button
                            class="btn btn-success"
                            @click="revealAnswer()"
                            x-show="!answerRevealed && currentItem && currentItem.type === 'question'"
                        >
                            ✅ Reveal Answer
                        </button>
                        <button
                            class="btn btn-primary"
                            @click="nextItem()"
                            :disabled="currentIndex >= quizData.length - 1"
                        >
                            ➡️ Next
                        </button>
                        <button
                            class="btn btn-secondary"
                            @click="prevItem()"
                            :disabled="currentIndex <= 0"
                        >
                            ⬅️ Previous
                        </button>
                        <button class="btn btn-danger" @click="resetGame()">🔄 Reset Quiz</button>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar" x-show="isAuthenticated">
                <div class="card" x-show="currentView === 'game' && !continuousScoreboard">
                    <h3 style="font-size: 1rem; margin-bottom: 1rem">📺 Broadcast</h3>
                    <label style="display: flex; gap: 0.75rem; align-items: center; cursor: pointer;">
                        <input type="checkbox" :checked="showScoreboard" @change="toggleScoreboard()" style="width: 1.25rem; height: 1.25rem;">
                        <span style="font-weight: 700; font-size: 0.875rem;">Show Scoreboard to Players</span>
                    </label>
                </div>
                <div class="card" x-show="currentView === 'game'">
                    <h3 style="font-size: 1rem; margin-bottom: 1rem">📥 Answers</h3>
                    <div
                        class="text-sm"
                        style="
                            text-align: center;
                            margin-bottom: 1rem;
                            font-weight: 700;
                            background: var(--color-bg);
                            padding: 0.5rem;
                            border-radius: var(--radius-md);
                            color: var(--color-primary);
                        "
                    >
                        <span x-text="currentQuestionAnswers.length"></span> /
                        <span x-text="onlinePlayerCount"></span> ANSWERED
                    </div>
                    <div class="scroll-list">
                        <template x-for="ans in currentQuestionAnswers" :key="ans.playerId">
                            <div
                                class="list-row text-sm"
                                :style="ans.isCorrect ? 'background: #f0fdf4; color: var(--color-success)' : ''"
                            >
                                <strong x-text="ans.playerName"></strong>
                                <span x-text="ans.answer" style="font-weight: 600"></span>
                            </div>
                        </template>
                        <div
                            x-show="currentQuestionAnswers.length === 0"
                            class="text-muted text-sm"
                            style="text-align: center; padding: 1rem"
                        >
                            Waiting for answers...
                        </div>
                    </div>
                </div>
                <div class="card">
                    <h3 style="font-size: 1rem; margin-bottom: 1rem">🏆 Scoreboard</h3>
                    <div class="scroll-list">
                        <template x-for="(player, index) in playerList" :key="player.id">
                            <div
                                class="list-row"
                                :class="{'leader': index === 0 && player.score > 0}"
                            >
                                <div>
                                    <div style="font-weight: 700; font-size: 0.9375rem">
                                        <span x-show="index === 0 && player.score > 0">👑</span>
                                        <span x-text="player.name"></span>
                                    </div>
                                    <small
                                        class="text-sm"
                                        style="font-weight: 600"
                                        :style="player.online ? 'color: var(--color-success)' : 'color: var(--color-secondary)'"
                                        x-text="player.online ? '🟢 Online' : '⚪ Offline'"
                                    ></small>
                                </div>
                                <div style="text-align: right">
                                    <div
                                        style="font-size: 1.125rem; font-weight: 800; color: var(--color-success)"
                                        x-text="player.score"
                                    ></div>
                                    <button
                                        class="btn btn-secondary"
                                        style="padding: 2px 8px; font-size: 0.75rem; margin-top: 4px"
                                        @click="removePlayer(player.id)"
                                    >
                                        Remove
                                    </button>
                                </div>
                            </div>
                        </template>
                        <div
                            x-show="playerList.length === 0"
                            class="text-muted text-sm"
                            style="text-align: center; padding: 1rem"
                        >
                            No players yet.
                        </div>
                    </div>
                    <button
                        class="btn btn-danger"
                        style="width: 100%; margin-top: 1rem"
                        @click="clearPlayers()"
                    >
                        🗑️ Kick All Players
                    </button>

                    <div
                        class="text-muted"
                        style="
                            margin-top: 2rem;
                            text-align: center;
                            font-size: 0.75rem;
                            font-weight: 600;
                            letter-spacing: 0.05em;
                        "
                    >
                        TRIVIA HOST <span id="app-version"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- SCRIPT LOADING (CRITICAL ORDER) -->
        <!-- 0. Version Info -->
        <script src="../shared/version.js"></script>
        <script src="../shared/ui-components.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <!-- 1. Firebase Compat Libraries -->
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>

        <!-- 2. Firebase Configuration & Helper -->
        <script src="../config/firebase-config.js?v=cachebust-fix"></script>
        <script src="../shared/firebase-helper.js"></script>
        <script src="../shared/quiz-parser.js"></script>

        <!-- 3. Application Logic (No Module, No Defer) -->
        <script src="host-data.js?v=1.5"></script>
        <script src="host-alpine.js?v=1.5"></script>

        <!-- 4. Alpine.js (Defer ensures it waits for the scripts above to register listeners) -->
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

        <script>
            // Initialize Version
            document.addEventListener('DOMContentLoaded', () => {
                if (typeof displayVersion === 'function') displayVersion('app-version');
            });

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker
                        .register('../sw.js')
                        .then((reg) => console.log('SW registered'))
                        .catch((err) => console.log('SW registration failed', err));
                });
            }
        </script>
    </body>
</html>
