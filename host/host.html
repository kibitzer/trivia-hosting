<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trivia Host Control Panel</title>

        <!-- Shared Head Helper (Dependencies) -->
        <script src="../shared/head-helper.js"></script>

        <style>
        .host-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2rem;
            height: calc(100vh - 40px);
            overflow: hidden;
        }
        .main-stage {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .control-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        /* Audience Preview */
        .audience-preview-label {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-muted);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .question-text {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            line-height: 1.2;
            color: var(--color-text);
        }
        .question-image {
            max-height: 320px;
            width: 100%;
            object-fit: contain;
            border-radius: var(--radius-lg);
            margin-bottom: 1.5rem;
            background: white;
            border: 1px solid var(--color-border);
        }

        /* Action Bar */
        .host-action-bar {
            position: sticky;
            bottom: 0;
            background: var(--color-surface);
            padding: 1.5rem;
            border-top: 1px solid var(--color-border);
            display: flex;
            gap: 1rem;
            justify-content: center;
            box-shadow: 0 -10px 15px -3px rgb(0 0 0 / 0.05);
            z-index: 100;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }
        .btn-xl {
            padding: 1rem 2rem;
            font-size: 1.125rem;
            font-weight: 800;
        }

        /* Answer Stats */
        .answer-stats-badge {
            background: var(--color-primary-light);
            color: var(--color-primary);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 800;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body x-data="triviaHost">
    <!-- Connectivity Overlay -->
    <div x-html="TriviaUI.connectivityOverlay()"></div>

    <div class="container" style="max-width: 1440px;">
        <!-- Header / Navigation -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="btn btn-secondary">← Dashboard</a>
                <h1 style="font-size: 1.5rem;">🎯 Host Panel</h1>
            </div>
            <div class="flex items-center gap-4">
                <div x-html="TriviaUI.connectionStatus()"></div>
                <span class="text-xs font-extrabold text-muted" x-text="'v' + appVersion"></span>
            </div>
        </div>

        <!-- VIEW: Loading -->
        <div x-show="waitingForAuth || loading || !quizData.length" class="card text-center" style="padding: 10rem 2rem;">
            <div class="timer-display timer-running">⏳</div>
            <p class="text-muted text-lg font-bold" x-text="waitingForAuth ? 'Verifying Authentication...' : (loading ? 'Loading Quiz...' : 'Preparing Host Panel...')"></p>
        </div>

        <!-- VIEW: Main Host Layout -->
        <div class="host-layout" x-show="!waitingForAuth && isAuthenticated && quizData.length > 0">
            <!-- Left: Main Stage (What the audience sees) -->
            <div class="main-stage">
                <!-- SETUP VIEW -->
                <div x-show="currentView === 'setup'" class="card text-center" style="padding: 6rem 2rem;">
                    <div style="font-size: 4rem; margin-bottom: 2rem;">🚀</div>
                    <h2 style="font-size: 2.5rem; margin-bottom: 1rem;">Ready to Start?</h2>
                    <p class="text-muted text-lg mb-8" style="font-weight: 600;">
                        <span class="text-primary" x-text="quizData.length"></span> items loaded &bull; 
                        <span class="text-success" x-text="playerCount"></span> players waiting in lobby.
                    </p>
                    <button class="btn btn-primary btn-xl" @click="startGame()">Start Live Game</button>
                </div>

                <!-- GAME VIEW -->
                <div x-show="currentView === 'game'" class="flex-col" style="flex: 1;">
                    <div class="audience-preview-label">
                        <span>📺 Audience Preview</span>
                        <div style="flex: 1; height: 1px; background: var(--color-border);"></div>
                        <span x-text="'ITEM ' + (currentIndex + 1) + ' / ' + quizData.length"></span>
                    </div>

                    <div class="card" style="flex: 1; position: relative; padding: 2.5rem;">
                        <div :key="currentIndex" x-transition:enter="fade-enter-active" x-transition:enter-start="fade-enter-from" x-transition:enter-end="fade-enter-to">
                            <!-- ROUND INTRO PREVIEW -->
                            <template x-if="currentItem && currentItem.type === 'round-title'">
                                <div class="slide-card" style="min-height: 400px; margin-bottom: 0;">
                                    <template x-if="currentItem.image">
                                        <div class="slide-card-bg" :style="`background-image: url('${currentItem.image}')`"></div>
                                    </template>
                                    <div class="slide-card-content">
                                        <div class="text-sm font-extrabold" style="opacity: 0.9; letter-spacing: 0.2em; margin-bottom: 1rem;">ROUND <span x-text="currentItem.roundNumber"></span></div>
                                        <h2 x-text="currentItem.title" style="font-size: 3rem;"></h2>
                                    </div>
                                </div>
                            </template>

                            <!-- QUESTION PREVIEW -->
                            <template x-if="currentItem && currentItem.type === 'question'">
                                <div class="flex-col">
                                    <div class="flex justify-between items-center mb-6">
                                        <div class="flex items-center gap-3">
                                            <span class="question-number">Q<span x-text="currentItem.questionNumber"></span></span>
                                            <template x-if="currentItem.difficulty">
                                                <span class="text-xs font-extrabold" :style="'color: ' + TriviaUI.getDifficultyColor(currentItem.difficulty)" x-text="currentItem.difficulty.toUpperCase()"></span>
                                            </template>
                                        </div>
                                        <div x-html="TriviaUI.timer()"></div>
                                    </div>

                                    <div class="question-text" x-html="currentItem.text"></div>

                                    <template x-if="currentItem.image">
                                        <img :src="currentItem.image" class="question-image" onerror="this.style.display = 'none'" />
                                    </template>

                                    <!-- Correct Answer Reveal (Host View) -->
                                    <div x-show="answerRevealed" class="card" style="background: var(--color-success-bg); border: 2px solid var(--color-success); text-align: center; margin-top: 1rem;">
                                        <div class="text-xs font-extrabold text-success mb-2" style="letter-spacing: 0.1em;">CORRECT ANSWER</div>
                                        <div style="font-size: 2.5rem; font-weight: 900; color: var(--color-success);" x-text="currentItem.answer"></div>
                                    </div>

                                    <!-- Fact Checking Info -->
                                    <div x-show="currentItem.factCheckingSource && answerRevealed" class="mt-4 p-4" style="background: var(--color-primary-light); border-left: 4px solid var(--color-primary); border-radius: var(--radius-md);">
                                        <div class="text-xs font-extrabold text-primary mb-1">FACT CHECKING</div>
                                        <div class="text-sm font-bold" x-html="currentItem.factCheckingSource"></div>
                                    </div>
                                    
                                    <!-- Host Notes -->
                                    <div x-show="currentItem.notes && answerRevealed" class="mt-4 p-4" style="background: var(--color-warning-bg); border-left: 4px solid var(--color-warning); border-radius: var(--radius-md);">
                                        <div class="text-xs font-extrabold text-warning mb-1">HOST NOTES</div>
                                        <div class="text-sm font-bold" x-html="currentItem.notes"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Host Action Bar -->
                    <div class="host-action-bar">
                        <button class="btn btn-secondary" @click="prevItem()" :disabled="currentIndex <= 0">⬅️ Previous</button>
                        
                        <div class="flex gap-2">
                            <button class="btn btn-warning btn-xl" @click="stopTimer()" x-show="timerStatus === 'running' || timerStatus === 'countdown'">⏯️ Skip Timer</button>
                            <button class="btn btn-success btn-xl" @click="revealAnswer()" x-show="!answerRevealed && currentItem && currentItem.type === 'question'">✅ Reveal Answer</button>
                        </div>

                        <button class="btn btn-primary btn-xl" @click="nextItem()" :disabled="currentIndex >= quizData.length - 1">Next Item ➡️</button>
                    </div>
                </div>
            </div>

            <!-- Right: Control Sidebar (Host only data) -->
            <div class="control-sidebar">
                <!-- Live Submissions -->
                <div class="card" x-show="currentView === 'game' && currentItem && currentItem.type === 'question'">
                    <h3 class="text-sm font-extrabold text-muted mb-4" style="letter-spacing: 0.05em;">LIVE SUBMISSIONS</h3>
                    
                    <div class="answer-stats-badge">
                        <span x-text="currentQuestionAnswers.length"></span> / <span x-text="onlinePlayerCount"></span> ANSWERED
                    </div>

                    <div class="score-list" style="max-height: 240px; overflow-y: auto;">
                        <template x-for="ans in currentQuestionAnswers" :key="ans.playerId">
                            <div class="score-item" :style="ans.isCorrect ? 'background: var(--color-success-bg); border-color: var(--color-success); color: var(--color-success)' : ''">
                                <span class="score-item-name" x-text="ans.playerName"></span>
                                <span class="text-sm font-bold" x-text="ans.answer"></span>
                            </div>
                        </template>
                        <div x-show="currentQuestionAnswers.length === 0" class="text-center py-4 text-muted font-bold">Waiting for answers...</div>
                    </div>
                </div>

                <!-- Leaderboard -->
                <div class="card" style="flex: 1; display: flex; flex-direction: column;">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-sm font-extrabold text-muted" style="letter-spacing: 0.05em;">LEADERBOARD</h3>
                        <div class="flex gap-2">
                            <label class="text-xs font-bold flex items-center gap-1 cursor-pointer">
                                <input type="checkbox" :checked="showScoreboard" @change="toggleScoreboard()">
                                Show to Players
                            </label>
                        </div>
                    </div>

                    <div class="score-list" style="flex: 1; overflow-y: auto;">
                        <template x-for="(player, index) in playerList" :key="player.id">
                            <div class="score-item" :class="{'leader': index === 0 && player.score > 0}">
                                <div class="flex-col">
                                    <span class="score-item-name">
                                        <span x-show="index === 0 && player.score > 0">👑</span>
                                        <span x-text="player.name"></span>
                                    </span>
                                    <span class="text-xs font-bold" :style="player.online ? 'color: var(--color-success)' : 'color: var(--color-secondary)'" x-text="player.online ? '● Online' : '○ Offline'"></span>
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="score-item-score" x-text="player.score"></span>
                                    <button class="btn btn-secondary" style="padding: 0.25rem; border: none; font-size: 0.75rem;" @click="removePlayer(player.id)" title="Kick player">❌</button>
                                </div>
                            </div>
                        </template>
                        <div x-show="playerList.length === 0" class="text-center py-8 text-muted font-bold">No players connected.</div>
                    </div>

                    <div class="mt-6 flex flex-col gap-2">
                        <button class="btn btn-secondary btn-sm" @click="resetGame()">🔄 Reset Quiz State</button>
                        <button class="btn btn-danger btn-sm" @click="clearPlayers()">🗑️ Kick All Players</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
        <!-- Application Logic (No Module, No Defer) -->
        <script src="host-data.js?v=1.5"></script>
        <script src="host-alpine.js?v=1.5"></script>

        <script>
            // Initialize Version
            document.addEventListener('DOMContentLoaded', () => {
                // Version handled by Alpine appVersion
            });

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    // Unregister SW on localhost to prevent caching/redirection issues during dev
                    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        navigator.serviceWorker.getRegistrations().then(registrations => {
                            for (let registration of registrations) {
                                registration.unregister();
                                console.log('Service Worker unregistered on localhost');
                            }
                        });
                    } else {
                        navigator.serviceWorker
                            .register('../sw.js')
                            .then((reg) => console.log('SW registered'))
                            .catch((err) => console.log('SW registration failed', err));
                    }
                });
            }
        </script>
    </body>
</html>
