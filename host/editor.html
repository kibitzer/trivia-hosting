<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quiz Editor - Trivia Night</title>

        <!-- Shared Head Helper (Dependencies) -->
        <script src="../shared/head-helper.js"></script>

        <style>
            .editor-container {
                display: grid;
                grid-template-columns: 320px 1fr;
                height: calc(100vh - 64px);
                overflow: hidden;
                background: var(--color-bg);
            }
            
            /* Navigation Sidebar */
            .editor-sidebar {
                background: var(--color-surface);
                border-right: 1px solid var(--color-border);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .slide-list {
                flex: 1;
                overflow-y: auto;
                padding: 1.25rem;
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            .slide-thumb {
                aspect-ratio: 16/9;
                background: var(--color-bg);
                border: 2px solid var(--color-border);
                border-radius: var(--radius-md);
                padding: 1rem;
                cursor: pointer;
                transition: var(--transition);
                display: flex;
                flex-direction: column;
                position: relative;
                box-shadow: var(--shadow-sm);
            }
            .slide-thumb:hover {
                border-color: var(--color-primary);
                background: white;
            }
            .slide-thumb.active {
                border-color: var(--color-primary);
                background: white;
                box-shadow: 0 0 0 3px var(--color-primary-light);
            }
            .slide-thumb-number {
                font-size: 0.65rem;
                font-weight: 900;
                color: var(--color-primary);
                margin-bottom: 0.5rem;
                letter-spacing: 0.1em;
            }
            .slide-thumb-preview {
                font-size: 0.8125rem;
                font-weight: 700;
                line-height: 1.3;
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .slide-thumb-preview * {
                display: inline;
                margin: 0;
                padding: 0;
            }

            /* Main Workspace */
            .editor-workspace {
                padding: 3rem;
                overflow-y: auto;
                display: flex;
                justify-content: center;
            }
            .editor-canvas {
                width: 100%;
                max-width: 900px;
                background: var(--color-surface);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-md);
                border: 1px solid var(--color-border);
                padding: 3rem;
                min-height: fit-content;
            }

            /* MC Options */
            .mc-options-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
            .mc-option-item {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                background: var(--color-bg);
                padding: 0.75rem;
                border-radius: var(--radius-md);
                border: 1px solid var(--color-border);
                transition: var(--transition);
            }
            .mc-option-item:focus-within {
                border-color: var(--color-primary);
                background: white;
            }
            .mc-option-item.correct {
                border-color: var(--color-success);
                background: var(--color-success-bg);
            }

            /* Rebus Manager */
            .rebus-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 1rem;
                background: var(--color-bg);
                padding: 1.5rem;
                border-radius: var(--radius-lg);
                border: 1px solid var(--color-border);
            }
            .rebus-thumb {
                aspect-ratio: 1;
                border-radius: var(--radius-md);
                border: 2px solid var(--color-border);
                overflow: hidden;
                position: relative;
                background: white;
                cursor: grab;
            }
            .rebus-thumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .rebus-delete {
                position: absolute;
                top: 0.25rem;
                right: 0.25rem;
                background: var(--color-danger);
                color: white;
                border: none;
                width: 20px;
                height: 20px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.75rem;
                cursor: pointer;
                opacity: 0;
                transition: var(--transition);
            }
            .rebus-thumb:hover .rebus-delete {
                opacity: 1;
            }

            /* Settings Bar */
            .editor-top-bar {
                background: var(--color-surface);
                border-bottom: 1px solid var(--color-border);
                padding: 0.75rem 1.5rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                z-index: 100;
            }

            /* RTE Styling Override */
            .rte-container {
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
            .pell-actionbar {
                background-color: var(--color-bg) !important;
                border-bottom: 1px solid var(--color-border) !important;
                flex-shrink: 0;
            }
            .pell-button {
                background-color: transparent !important;
                border: none !important;
                color: var(--color-text-muted) !important;
                font-weight: 800 !important;
                width: 32px !important;
                height: 32px !important;
            }
            .pell-button-selected {
                color: var(--color-primary) !important;
                background-color: var(--color-primary-light) !important;
            }
            .pell-content {
                padding: 0.75rem 1rem !important;
                outline: none !important;
                flex: 1;
                height: auto !important;
                min-height: 40px !important;
            }
            .rte-compact .pell-content {
                min-height: 40px !important;
            }

            /* Tagging UI */
            .tag-manager {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
            }
            .tag-list {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            .tag-item {
                display: inline-flex;
                align-items: center;
                gap: 0.375rem;
                padding: 0.25rem 0.75rem;
                background: var(--color-primary-light);
                color: var(--color-primary);
                border-radius: var(--radius-full);
                font-size: 0.75rem;
                font-weight: 800;
                border: 1px solid var(--color-primary);
            }
            .tag-remove {
                cursor: pointer;
                opacity: 0.7;
                transition: var(--transition);
            }
            .tag-remove:hover {
                opacity: 1;
                color: var(--color-danger);
            }
            .tag-input-container {
                position: relative;
            }
            .tag-suggestions {
                position: absolute;
                bottom: 100%;
                left: 0;
                right: 0;
                background: white;
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                box-shadow: var(--shadow-lg);
                z-index: 1000;
                max-height: 200px;
                overflow-y: auto;
                margin-bottom: 0.25rem;
            }
            .tag-suggestion-item {
                padding: 0.5rem 1rem;
                cursor: pointer;
                font-size: 0.875rem;
                font-weight: 600;
            }
            .tag-suggestion-item:hover, .tag-suggestion-item.active {
                background: var(--color-primary-light);
                color: var(--color-primary);
            }

            .image-thumbnail {
                width: 80px;
                height: 80px;
                border-radius: var(--radius-md);
                border: 1px solid var(--color-border);
                overflow: hidden;
                background: var(--color-bg);
                flex-shrink: 0;
            }
            .image-thumbnail img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            /* Type Selection Grid */
            .type-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
                margin-top: 1rem;
            }
            .type-option {
                padding: 1.5rem;
                border: 2px solid var(--color-border);
                border-radius: var(--radius-md);
                cursor: pointer;
                transition: var(--transition);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
                background: white;
            }
            .type-option:hover {
                border-color: var(--color-primary);
                background: var(--color-primary-light);
            }
            .type-option.selected {
                border-color: var(--color-primary);
                background: var(--color-primary-light);
                box-shadow: 0 0 0 2px var(--color-primary);
            }
            .type-icon {
                font-size: 2rem;
            }
            .type-label {
                font-weight: 800;
                font-size: 0.875rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }
        </style>
    </head>
    <body x-data="quizEditor">
        <!-- Connectivity Overlay -->
        <div x-html="TriviaUI.connectivityOverlay()"></div>

        <div x-show="waitingForAuth" style="text-align: center; padding: 4rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem; animation: pulse 1.5s infinite;">⏳</div>
            <p class="text-muted">Verifying Authentication...</p>
        </div>

        <div x-show="!waitingForAuth && editingQuizId" class="flex-col" style="height: 100vh;">
            <!-- Top Navigation Bar -->
            <header class="editor-top-bar">
                <div class="flex items-center gap-4">
                    <button @click="closeEditor()" class="btn btn-secondary btn-sm">← Dashboard</button>
                    <div style="width: 1px; height: 24px; background: var(--color-border);"></div>
                    <input
                        type="text"
                        x-model="currentQuiz.title"
                        class="font-extrabold"
                        style="border: none; background: transparent; font-size: 1.125rem; padding: 0.25rem 0.5rem; width: 400px; box-shadow: none;"
                        onfocus="this.style.background = 'var(--color-bg)'"
                        onblur="this.style.background = 'transparent'"
                    />
                </div>
                            <div class="flex items-center gap-4">
                                <div x-show="statusMsg" class="text-sm font-bold" :class="statusMsg.includes('✅') ? 'text-success' : 'text-primary'" x-text="statusMsg"></div>
                                <div class="text-xs font-bold text-muted" x-text="'v' + appVersion"></div>
                                <button @click="showGameOptions = true" class="btn btn-secondary btn-sm">⚙️ Quiz Settings</button>
                                <button @click="showQuestionBank = true" class="btn btn-primary btn-sm">📂 Question Bank</button>
                            </div>            </header>

            <div class="editor-container">
                <!-- Sidebar: Slide Navigator -->
                <aside class="editor-sidebar">
                    <div class="slide-list" id="slide-list-container">
                        <template x-for="(q, index) in currentQuiz.questions" :key="q.id">
                            <div
                                class="slide-thumb"
                                :class="{ 'active': selectedQuestionIndex === index }"
                                @click="selectQuestion(index)"
                                :data-id="q.id"
                            >
                                <div class="slide-thumb-number" x-text="(q.type === 'round-title' ? 'ROUND ' : 'SLIDE ') + (index + 1)"></div>
                                <div class="slide-thumb-preview" x-html="q.type === 'round-title' ? q.title : (q.question || '(New Question)')"></div>
                                <div class="text-xs font-bold text-muted mt-auto" style="text-transform: uppercase;" x-text="q.type.replace('-', ' ')"></div>
                            </div>
                        </template>
                    </div>
                    
                    <div class="p-4 border-t flex gap-2">
                        <button @click="addQuestion()" class="btn btn-primary btn-sm" style="flex: 1;">+ Question</button>
                        <button @click="addRound()" class="btn btn-secondary btn-sm" style="flex: 1;">+ Round</button>
                    </div>
                </aside>

                <!-- Main Workspace: Slide Canvas -->
                <main class="editor-workspace">
                    <template x-if="currentQuiz.questions[selectedQuestionIndex]">
                        <div class="editor-canvas">
                            <div class="flex justify-between items-center mb-8 pb-4 border-b">
                                <h2 style="font-size: 1.5rem;" x-text="(currentQuiz.questions[selectedQuestionIndex].type === 'round-title' ? 'Round Introduction' : 'Question Editor')"></h2>
                                <button @click="removeQuestion(selectedQuestionIndex)" class="btn btn-sm" style="color: var(--color-danger); border: none;">🗑️ Delete Slide</button>
                            </div>

                            <!-- SLIDE TYPE & BASIC SETTINGS -->
                            <div class="grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 2.5rem;">
                                <div class="flex-col gap-2">
                                    <label class="text-xs font-extrabold text-muted">SLIDE TYPE</label>
                                    <select x-model="currentQuiz.questions[selectedQuestionIndex].type" @change="handleTypeChange($event.target.value)">
                                        <option value="multiple">Multiple Choice</option>
                                        <option value="short">Short Answer</option>
                                        <option value="rebus">Rebus</option>
                                        <option value="true-false">True / False</option>
                                        <option value="identify">Identify Image</option>
                                        <option value="round-title">Round Title</option>
                                    </select>
                                </div>
                                <template x-if="currentQuiz.questions[selectedQuestionIndex].type !== 'round-title'">
                                    <div class="flex-col gap-2">
                                        <label class="text-xs font-extrabold text-muted">TIMER (SECONDS)</label>
                                        <input type="number" x-model.number="currentQuiz.questions[selectedQuestionIndex].timer" min="5" step="5">
                                    </div>
                                </template>
                                <template x-if="currentQuiz.questions[selectedQuestionIndex].type !== 'round-title'">
                                    <div class="flex-col gap-2">
                                        <label class="text-xs font-extrabold text-muted">DIFFICULTY</label>
                                        <select x-model="currentQuiz.questions[selectedQuestionIndex].difficulty">
                                            <option value="Easy">Easy</option>
                                            <option value="Medium">Medium</option>
                                            <option value="Hard">Hard</option>
                                        </select>
                                    </div>
                                </template>
                            </div>

                            <!-- CONTENT: Round Title -->
                            <template x-if="currentQuiz.questions[selectedQuestionIndex].type === 'round-title'">
                                <div class="flex-col gap-6">
                                    <div class="flex-col gap-2">
                                        <label class="text-xs font-extrabold text-muted">ROUND TITLE TEXT</label>
                                        <input type="text" x-model="currentQuiz.questions[selectedQuestionIndex].title" placeholder="e.g. Round 1: History" style="font-size: 1.5rem; font-weight: 800; padding: 1.25rem;">
                                    </div>
                                    <div class="flex-col gap-2">
                                        <label class="text-xs font-extrabold text-muted">BACKGROUND IMAGE URL</label>
                                        <div class="flex gap-4 items-start">
                                            <div x-show="currentQuiz.questions[selectedQuestionIndex].image" class="image-thumbnail">
                                                <img :src="currentQuiz.questions[selectedQuestionIndex].image" alt="Thumbnail">
                                            </div>
                                            <div class="flex gap-2" style="flex: 1;">
                                                <input type="text" x-model="currentQuiz.questions[selectedQuestionIndex].image" placeholder="https://...">
                                                <button class="btn btn-secondary" @click="$refs.roundFile.click()">📁 Upload</button>
                                                <input type="file" x-ref="roundFile" style="display: none" accept="image/*" @change="uploadImage($event, 'image')">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <!-- CONTENT: Question -->
                            <template x-if="currentQuiz.questions[selectedQuestionIndex].type !== 'round-title'">
                                <div class="flex-col gap-6">
                                    <!-- Tagging Manager -->
                                    <div class="tag-manager">
                                        <label class="text-xs font-extrabold text-muted">QUESTION TAGS</label>
                                        <div class="tag-list" x-show="currentQuiz.questions[selectedQuestionIndex].tags?.length > 0">
                                            <template x-for="tag in currentQuiz.questions[selectedQuestionIndex].tags" :key="tag">
                                                <span class="tag-item">
                                                    <span x-text="tag"></span>
                                                    <span class="tag-remove" @click="removeTag(tag)">&times;</span>
                                                </span>
                                            </template>
                                        </div>
                                        <div class="tag-input-container">
                                            <input 
                                                type="text" 
                                                x-model="newTagInput" 
                                                placeholder="Add a tag (e.g. History, Science)..."
                                                @input="updateTagSuggestions()"
                                                @keydown.enter.prevent="addTag()"
                                                @keydown.arrow-down.prevent="navigateTagSuggestions('down')"
                                                @keydown.arrow-up.prevent="navigateTagSuggestions('up')"
                                                @keydown.escape="tagSuggestions = []"
                                            >
                                            <div class="tag-suggestions" x-show="tagSuggestions.length > 0" x-cloak>
                                                <template x-for="(tag, idx) in tagSuggestions" :key="tag">
                                                    <div 
                                                        class="tag-suggestion-item" 
                                                        :class="{ 'active': activeTagSuggestionIndex === idx }"
                                                        @click="selectTag(tag)"
                                                        x-text="tag"
                                                    ></div>
                                                </template>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="flex-col gap-2">
                                        <label class="text-xs font-extrabold text-muted">QUESTION TEXT</label>
                                        <div class="rte-container rte-compact" x-init="initRTE($el, 'question', currentQuiz.questions[selectedQuestionIndex].question)" :key="'q-rte-' + currentQuiz.questions[selectedQuestionIndex].id"></div>
                                    </div>

                                    <template x-if="currentQuiz.questions[selectedQuestionIndex].type !== 'rebus'">
                                        <div class="flex-col gap-2">
                                            <label class="text-xs font-extrabold text-muted">SLIDE IMAGE (OPTIONAL)</label>
                                            <div class="flex gap-4 items-start">
                                                <div x-show="currentQuiz.questions[selectedQuestionIndex].image" class="image-thumbnail">
                                                    <img :src="currentQuiz.questions[selectedQuestionIndex].image" alt="Thumbnail">
                                                </div>
                                                <div class="flex gap-2" style="flex: 1;">
                                                    <input type="text" x-model="currentQuiz.questions[selectedQuestionIndex].image" placeholder="https://...">
                                                    <button class="btn btn-secondary" @click="$refs.qFile.click()">📁 Upload</button>
                                                    <input type="file" x-ref="qFile" style="display: none" accept="image/*" @change="uploadImage($event, 'image')">
                                                </div>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- Rebus Image Manager -->
                                    <template x-if="currentQuiz.questions[selectedQuestionIndex].type === 'rebus'">
                                        <div class="flex-col gap-4">
                                            <div class="flex justify-between items-center">
                                                <label class="text-xs font-extrabold text-muted">REBUS IMAGES (ORDER MATTERS)</label>
                                                <button class="btn btn-secondary btn-sm" @click="$refs.rebusFile.click()">+ Add Image</button>
                                                <input type="file" x-ref="rebusFile" style="display: none" accept="image/*" @change="uploadRebusImage($event)">
                                            </div>
                                            <div class="rebus-grid" id="rebus-sortable-list">
                                                <template x-for="(img, idx) in currentQuiz.questions[selectedQuestionIndex].rebusImages" :key="idx">
                                                    <div class="rebus-thumb">
                                                        <img :src="img">
                                                        <button class="rebus-delete" @click="removeRebusImage(idx)">&times;</button>
                                                        <div style="position: absolute; bottom: 0.25rem; left: 0.25rem; background: rgba(0,0,0,0.6); color: white; padding: 0.1rem 0.3rem; border-radius: 4px; font-size: 0.65rem; font-weight: 900;" x-text="idx + 1"></div>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- Answers: Multiple Choice -->
                                    <template x-if="currentQuiz.questions[selectedQuestionIndex].type === 'multiple'">
                                        <div class="flex-col gap-4">
                                            <div class="flex justify-between items-center">
                                                <label class="text-xs font-extrabold text-muted">OPTIONS & CORRECT ANSWER</label>
                                                <button @click="autoGenerateOptions()" class="btn btn-secondary btn-sm" style="border-color: #9333ea; color: #9333ea;">✨ AI Generate</button>
                                            </div>
                                            <div class="mc-options-grid">
                                                <template x-for="(opt, oIdx) in currentQuiz.questions[selectedQuestionIndex].options" :key="oIdx">
                                                    <div class="mc-option-item" :class="{ 'correct': currentQuiz.questions[selectedQuestionIndex].correctAnswer === opt }">
                                                        <input type="radio" :name="'correct-' + selectedQuestionIndex" :checked="currentQuiz.questions[selectedQuestionIndex].correctAnswer === opt" @change="currentQuiz.questions[selectedQuestionIndex].correctAnswer = opt">
                                                        <input type="text" x-model="currentQuiz.questions[selectedQuestionIndex].options[oIdx]" class="font-bold" style="border: none; background: transparent; padding: 0; box-shadow: none;">
                                                        <button @click="removeOption(oIdx)" class="text-muted hover:text-danger" style="background: none; border: none; cursor: pointer;">🗑️</button>
                                                    </div>
                                                </template>
                                            </div>
                                            <button @click="addOption()" class="btn btn-secondary btn-sm" style="border-style: dashed;">+ Add Option</button>
                                        </div>
                                    </template>

                                    <!-- Answers: Short Answer / Rebus -->
                                    <template x-if="['short', 'rebus', 'identify', 'true-false'].includes(currentQuiz.questions[selectedQuestionIndex].type)">
                                        <div class="flex-col gap-2">
                                            <label class="text-xs font-extrabold text-muted">ACCEPTED ANSWERS (COMMA SEPARATED)</label>
                                            <input type="text" :value="Array.isArray(currentQuiz.questions[selectedQuestionIndex].correctAnswer) ? currentQuiz.questions[selectedQuestionIndex].correctAnswer.join(', ') : currentQuiz.questions[selectedQuestionIndex].correctAnswer" @input="currentQuiz.questions[selectedQuestionIndex].correctAnswer = $event.target.value.split(',').map(s => s.trim())">
                                        </div>
                                    </template>

                                    <!-- Host Tools -->
                                    <div class="flex-col mt-8 pt-8 border-t gap-6">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" x-model="currentQuiz.questions[selectedQuestionIndex].factCheckingRequired" style="width: 1.25rem; height: 1.25rem;">
                                            <span class="text-xs font-extrabold text-muted">FACT CHECK REQUIRED</span>
                                        </label>

                                        <div class="grid items-start" style="grid-template-columns: 1fr 1fr; gap: 2rem;">
                                            <div class="flex-col gap-2">
                                                <label class="text-xs font-extrabold text-muted">SOURCE VERIFICATION</label>
                                                <div class="rte-container" x-init="initRTE($el, 'factCheckingSource', currentQuiz.questions[selectedQuestionIndex].factCheckingSource)" :key="'s-rte-' + currentQuiz.questions[selectedQuestionIndex].id" style="height: 120px;"></div>
                                            </div>
                                            <div class="flex-col gap-2">
                                                <label class="text-xs font-extrabold text-muted">HOST NOTES</label>
                                                <div class="rte-container" x-init="initRTE($el, 'notes', currentQuiz.questions[selectedQuestionIndex].notes)" :key="'n-rte-' + currentQuiz.questions[selectedQuestionIndex].id" style="height: 120px;"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </main>
            </div>
        </div>

        <!-- Question Bank Modal (Slide-out style) -->
        <div class="modal-backdrop" x-show="showQuestionBank" x-cloak @click.self="showQuestionBank = false" style="justify-content: flex-end;">
            <div x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0" class="card" style="width: 600px; height: 100vh; border-radius: 0; margin: 0; display: flex; flex-direction: column;">
                <div class="flex justify-between items-center mb-6">
                    <h2 style="color: var(--color-primary)">📂 Question Bank</h2>
                    <button @click="showQuestionBank = false" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
                </div>

                <div class="mb-4">
                    <input type="text" x-model="bankSearchQuery" placeholder="Search by text or tags..." style="padding: 0.75rem 1rem;">
                </div>

                <div style="flex: 1; overflow-y: auto; background: var(--color-bg); border-radius: var(--radius-md); border: 1px solid var(--color-border);">
                    <template x-for="q in paginatedBankQuestions" :key="q.id">
                        <div class="p-4 border-b bg-white flex justify-between items-start gap-4">
                            <div class="flex-col gap-1" style="flex: 1; min-width: 0;">
                                <div class="text-xs font-extrabold text-muted" x-text="q.type.toUpperCase() + ' • ' + q.difficulty.toUpperCase()"></div>
                                <div class="font-bold text-sm" x-html="q.question"></div>
                                <div class="flex flex-wrap gap-1 mt-1">
                                    <template x-for="tag in (q.tags || [])" :key="tag">
                                        <span class="text-xs font-bold text-primary" x-text="'#' + tag"></span>
                                    </template>
                                </div>
                            </div>
                            <button @click="addQuestionFromBank(q.id)" class="btn btn-primary btn-sm">+ Add</button>
                        </div>
                    </template>
                </div>

                <div class="flex justify-between items-center mt-4 pt-4 border-t">
                    <span class="text-xs font-bold text-muted" x-text="'Page ' + bankPage + ' of ' + totalBankPages"></span>
                    <div class="flex gap-2">
                        <button @click="prevBankPage()" :disabled="bankPage === 1" class="btn btn-secondary btn-sm">Prev</button>
                        <button @click="nextBankPage()" :disabled="bankPage === totalBankPages" class="btn btn-secondary btn-sm">Next</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quiz Settings Modal -->
        <div class="modal-backdrop" x-show="showGameOptions" x-cloak @click.self="showGameOptions = false">
            <div class="card" style="width: 440px;">
                <h2 class="mb-6" style="color: var(--color-primary)">⚙️ Quiz Settings</h2>
                
                <div class="flex-col gap-6">
                    <div class="flex-col gap-2">
                        <label class="text-xs font-extrabold text-muted">DEFAULT TIMER (SECONDS)</label>
                        <input type="number" x-model.number="currentQuiz.settings.defaultTimer" min="5" step="5">
                    </div>

                    <div class="flex-col gap-4">
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" x-model="currentQuiz.settings.speedScoring" style="width: 1.25rem; height: 1.25rem; margin-top: 0.1rem;">
                            <div class="flex-col">
                                <span class="font-bold">Speed Scoring</span>
                                <span class="text-xs text-muted">Bonus points for faster answers.</span>
                            </div>
                        </label>

                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" x-model="currentQuiz.settings.randomizeOptions" style="width: 1.25rem; height: 1.25rem; margin-top: 0.1rem;">
                            <div class="flex-col">
                                <span class="font-bold">Randomise MC Options</span>
                                <span class="text-xs text-muted">Shuffle answers for every player.</span>
                            </div>
                        </label>
                        
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" x-model="currentQuiz.settings.autoReveal" style="width: 1.25rem; height: 1.25rem; margin-top: 0.1rem;">
                            <div class="flex-col">
                                <span class="font-bold">Auto-Reveal</span>
                                <span class="text-xs text-muted">Show answer when everyone submitted.</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="mt-8">
                    <button @click="showGameOptions = false" class="btn btn-primary w-full" style="width: 100%;">Close Settings</button>
                </div>
            </div>
        </div>

        <!-- Page Specific Dependencies -->
        <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
        
        <!-- Application Logic -->
        <script src="editor-data.js"></script>

        <script>
            function initRTE(el, field, initialValue) {
                const data = Alpine.$data(el);
                
                const updateContent = (val) => {
                    if (el.content && el.content.innerHTML !== (val || '')) {
                        el.content.innerHTML = val || '';
                    }
                };

                el.innerHTML = '';
                
                const editor = pell.init({
                    element: el,
                    onChange: html => {
                        const q = data.currentQuiz.questions[data.selectedQuestionIndex];
                        if (q && q[field] !== html) {
                            q[field] = html;
                            data.triggerAutosave();
                        }
                    },
                    actions: ['bold', 'italic', 'underline', 'link']
                });
                
                updateContent(initialValue);

                data.$watch('selectedQuestionIndex', () => {
                    const q = data.currentQuiz.questions[data.selectedQuestionIndex];
                    if (q) updateContent(q[field]);
                });

                data.$watch('currentQuiz', (newVal) => {
                    if (!newVal) return;
                    const q = newVal.questions[data.selectedQuestionIndex];
                    if (q) updateContent(q[field]);
                });
            }

            document.addEventListener('alpine:init', () => {
                const fb = TriviaFirebase.init();
                if (fb) {
                    TriviaDataService.init(fb.db);
                    Alpine.data('quizEditor', () =>
                        window.createEditorData(fb.firebase, fb.db, fb.auth, fb.storage)
                    );
                }
            });
        </script>
    </body>
</html>
