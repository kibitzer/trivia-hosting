<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quiz Editor - Trivia Night</title>
        <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
        <link rel="stylesheet" href="../shared/styles.css?v=1.6" />
        <style>
            body {
                padding: 0;
                background: var(--color-bg);
            }
            .container {
                max-width: 1400px;
                margin: 0 auto;
                padding: 1.5rem;
            }
            .quiz-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem 0;
                border-bottom: 1px solid var(--color-border);
            }
            .quiz-item:last-child {
                border-bottom: none;
            }

            /* Quiz Table Styling */
            .quiz-table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 1rem;
            }
            .quiz-table th {
                text-align: left;
                padding: 1rem;
                background: var(--color-bg);
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-weight: 800;
                color: var(--color-text-muted);
                border-bottom: 2px solid var(--color-border);
                cursor: pointer;
                user-select: none;
            }
            .quiz-table th:hover {
                color: var(--color-primary);
            }
            .quiz-table th.active-sort {
                color: var(--color-primary);
            }
            .quiz-table td {
                padding: 1rem;
                border-bottom: 1px solid var(--color-border);
                vertical-align: middle;
            }
            .quiz-table tr:last-child td {
                border-bottom: none;
            }
            .quiz-table tr:hover {
                background: #f8fafc;
            }

            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 2rem;
            }

            /* Editor Layout */
            .editor-layout {
                display: flex;
                height: calc(100vh - 180px);
                gap: 1.5rem;
                margin-top: 1.5rem;
            }
            .sidebar {
                width: 300px;
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
                overflow-y: auto;
                padding-right: 0.5rem;
            }
            .slide-thumb {
                padding: 1rem;
                background: var(--color-surface);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                cursor: pointer;
                min-height: 100px;
                transition: all 0.2s;
                display: flex;
                flex-direction: column;
            }
            .slide-thumb.active {
                border-color: var(--color-primary);
                background: #f0f7ff;
                ring: 2px solid rgba(30, 64, 175, 0.1);
            }
            .slide-thumb:hover:not(.active) {
                border-color: var(--color-primary);
                background: var(--color-bg);
            }
            .slide-number {
                font-size: 0.75rem;
                color: var(--color-primary);
                font-weight: 800;
                margin-bottom: 0.5rem;
                letter-spacing: 0.05em;
            }
            .slide-preview {
                font-size: 0.875rem;
                font-weight: 600;
                color: var(--color-text);
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                line-height: 1.4;
            }

            .main-editor {
                flex: 1;
                overflow-y: auto;
                padding: 2.5rem;
                background: var(--color-surface);
                border-radius: var(--radius-lg);
                border: 1px solid var(--color-border);
                box-shadow: var(--shadow-sm);
            }

            /* Modal Styles */
            .modal-backdrop {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(15, 23, 42, 0.6);
                backdrop-filter: blur(4px);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 2000;
            }
            .modal-content {
                background: white;
                padding: 2.5rem;
                border-radius: var(--radius-lg);
                width: 100%;
                max-width: 440px;
                box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            }

            .input-group {
                margin-bottom: 1.25rem;
            }
            label {
                display: block;
                font-weight: 700;
                font-size: 0.875rem;
                margin-bottom: 0.5rem;
                color: var(--color-text);
            }

            .options-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem;
            }

            /* Game Options Panel */
            .game-options-panel {
                position: fixed;
                top: 80px; /* Below header */
                right: 0;
                bottom: 0;
                width: 320px;
                background: white;
                border-left: 1px solid var(--color-border);
                box-shadow: -4px 0 15px rgba(0,0,0,0.05);
                padding: 1.5rem;
                overflow-y: auto;
                z-index: 1000;
                transform: translateX(0);
                transition: transform 0.3s ease-in-out;
            }
            .game-options-panel[style*="display: none"] {
                transform: translateX(100%);
            }

            /* Tag Suggestions */
            .tag-input-container {
                position: relative;
            }
            .tag-suggestions {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: white;
                border: 1px solid var(--color-border);
                border-top: none;
                border-radius: 0 0 var(--radius-md) var(--radius-md);
                box-shadow: var(--shadow-md);
                z-index: 100;
                max-height: 200px;
                overflow-y: auto;
                padding: 0.5rem 0;
            }
            .tag-suggestion-item {
                padding: 0.5rem 1rem;
                cursor: pointer;
                font-size: 0.875rem;
                font-weight: 600;
            }
            .tag-suggestion-item:hover {
                background: var(--color-bg);
                color: var(--color-primary);
            }
            .tag-suggestion-item.active {
                background: var(--color-primary);
                color: white;
            }

            /* MC Option Component */
            .mc-option-item {
                display: flex;
                gap: 0.75rem;
                align-items: center;
                background: var(--color-surface);
                padding: 0.625rem;
                border-radius: var(--radius-md);
                border: 1px solid var(--color-border);
                transition: all 0.2s ease;
            }
            .mc-option-item:hover {
                border-color: var(--color-secondary);
                box-shadow: var(--shadow-sm);
            }
            .mc-option-item.is-correct {
                border-color: var(--color-success);
                background: #f0fdf4; /* Green 50 */
            }
            .mc-option-check {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                border: 2px solid var(--color-border);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                flex-shrink: 0;
                background: white;
                transition: all 0.2s;
                color: transparent;
                font-weight: 800;
                font-size: 0.875rem;
            }
            .mc-option-item.is-correct .mc-option-check {
                border-color: var(--color-success);
                background: white;
                color: var(--color-success);
                box-shadow: inset 0 0 0 2px #f0fdf4;
            }
            .mc-option-input {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                font-weight: 600 !important;
                flex: 1;
                font-size: 1rem !important;
                box-shadow: none !important;
            }
            .mc-option-delete {
                background: none;
                border: none;
                padding: 0.4rem;
                cursor: pointer;
                color: var(--color-secondary);
                opacity: 0.5;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: var(--radius-md);
            }
            .mc-option-delete:hover {
                opacity: 1;
                color: var(--color-danger);
                background: #fef2f2;
            }
        </style>
    </head>
    <body x-data="quizEditor">
        <div class="container" x-cloak>
            <div x-show="waitingForAuth" style="text-align: center; padding: 4rem;">
                <div style="font-size: 3rem; margin-bottom: 1rem; animation: pulse 1.5s infinite;">⏳</div>
                <p class="text-muted">Verifying Authentication...</p>
            </div>

            <div 
                x-show="!waitingForAuth && editingQuizId" 
                style="display: flex; flex-direction: column; height: 92vh"
                @input.stop="triggerAutosave()"
                @change.stop="triggerAutosave()"
            >
                <template x-if="dataLoaded">
                    <div style="display: flex; flex-direction: column; height: 100%; width: 100%;">
                        <div class="header" style="margin-bottom: 1rem">
                            <div style="display: flex; align-items: center; gap: 1rem; flex: 1">
                                <button
                                    @click="closeEditor()"
                                    class="btn btn-secondary"
                                    style="padding: 0.5rem 0.75rem"
                                >
                                    ← Dashboard
                                </button>
                                <div style="display: flex; flex-direction: column; flex: 1; max-width: 600px">
                                    <input
                                        type="text"
                                        x-model="currentQuiz.title"
                                        style="
                                            font-size: 1.25rem;
                                            font-weight: 800;
                                            border: none;
                                            background: transparent;
                                            padding: 0.25rem 0.5rem;
                                            border-radius: var(--radius-md);
                                            width: 100%;
                                        "
                                        onfocus="this.style.background = 'white'; this.style.boxShadow = 'var(--shadow-sm)'"
                                        onblur="this.style.background = 'transparent'; this.style.boxShadow = 'none'"
                                    />
                                    <span id="app-version-editor" class="text-muted" style="font-size: 0.65rem; font-weight: 700; margin-left: 0.5rem"></span>
                                </div>
                            </div>
                            <div style="display: flex; gap: 1rem; align-items: center">
                                <div style="display: flex; align-items: center; gap: 0.75rem; min-width: 450px; justify-content: flex-end">
                                    <div
                                        x-show="statusMsg"
                                        class="text-sm"
                                        style="
                                            padding: 0.375rem 0.75rem;
                                            border-radius: var(--radius-md);
                                            font-weight: 700;
                                        "
                                        :style="statusMsg.includes('⚠️') ? 'background: #fff7ed; color: var(--color-warning);' : (statusMsg.includes('❌') ? 'background: #fef2f2; color: var(--color-danger);' : 'background: #f0fdf4; color: var(--color-success);')"
                                        x-text="statusMsg"
                                    ></div>
                                    <button
                                        @click="showGameOptions = !showGameOptions"
                                        class="btn"
                                        :class="showGameOptions ? 'btn-primary' : 'btn-secondary'"
                                        style="padding: 0.5rem 0.75rem; white-space: nowrap"
                                    >
                                        ⚙️ Game Options
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="editor-layout">
                        <!-- Sidebar: Question List -->
                        <div class="sidebar">
                            <div id="slide-list-container" style="display: flex; flex-direction: column; gap: 0.5rem">
                                <template x-for="(q, index) in currentQuiz.questions" :key="q.id">
                                    <div
                                        class="slide-thumb"
                                        :data-id="q.id"
                                        :class="{ 'active': selectedQuestionIndex === index }"
                                        @click="selectQuestion(index)"
                                    >
                                        <div
                                            class="slide-number"
                                            x-show="settings.showQuestionNumbers"
                                            x-text="q.type === 'round-title' ? 'ROUND ' + q.roundNumber : 'QUESTION ' + q.questionNumber"
                                        ></div>
                                        <div
                                            class="slide-preview"
                                            x-text="q.type === 'round-title' ? q.title : (q.question || '(New Question)')"
                                        ></div>
                                        <div
                                            class="text-muted"
                                            style="margin-top: auto; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em"
                                            x-text="currentQuiz.questions[index].type === 'multiple' ? 'Multiple Choice' : (currentQuiz.questions[index].type === 'short' ? 'Short Answer' : (currentQuiz.questions[index].type === 'true-false' ? 'True / False' : (currentQuiz.questions[index].type === 'identify' ? 'Identify' : 'Round Intro')))"
                                        ></div>
                                    </div>
                                </template>
                            </div>
                            <div style="display: flex; gap: 0.5rem; margin-top: 1rem; position: sticky; bottom: 0; background: var(--color-bg); padding-top: 0.5rem">
                                <button
                                    @click="addQuestion()"
                                    class="btn btn-primary"
                                    style="flex: 1"
                                >
                                    + Question
                                </button>
                                <button
                                    @click="addRound()"
                                    class="btn btn-secondary"
                                    style="flex: 1"
                                >
                                    + Round
                                </button>
                            </div>
                        </div>

                        <!-- Main Area: Current Question Editor -->
                        <div class="main-editor">
                            <template x-if="currentQuiz.questions[selectedQuestionIndex]">
                                <div :key="currentQuiz.questions[selectedQuestionIndex].id">
                                    <div
                                        style="
                                            display: flex;
                                            justify-content: space-between;
                                            align-items: center;
                                            margin-bottom: 2rem;
                                            padding-bottom: 1rem;
                                            border-bottom: 1px solid var(--color-border);
                                        "
                                    >
                                        <h2
                                            style="margin: 0; color: var(--color-primary); font-size: 1.25rem"
                                            x-text="(currentQuiz.questions[selectedQuestionIndex].type === 'round-title' ? 'Round Intro ' + currentQuiz.questions[selectedQuestionIndex].roundNumber : 'Question ' + currentQuiz.questions[selectedQuestionIndex].questionNumber)"
                                        ></h2>
                                        <button
                                            @click="removeQuestion(selectedQuestionIndex)"
                                            class="btn btn-secondary"
                                            style="color: var(--color-danger); border-color: transparent"
                                        >
                                            Delete Slide
                                        </button>
                                    </div>

                                    <div
                                        style="
                                            display: grid;
                                            grid-template-columns: 1fr 1fr 1fr;
                                            gap: 1.25rem;
                                        "
                                    >
                                        <div class="input-group">
                                            <label>Slide Type</label>
                                            <select
                                                x-model="currentQuiz.questions[selectedQuestionIndex].type"
                                            >
                                                <option value="multiple">Multiple Choice</option>
                                                <option value="short">Short Answer</option>
                                                <option value="true-false">True / False</option>
                                                <option value="identify">Identify (Picture)</option>
                                                <option value="round-title">
                                                    Round Title (Intro)
                                                </option>
                                            </select>
                                        </div>
                                        <div
                                            class="input-group"
                                            x-show="currentQuiz.questions[selectedQuestionIndex].type !== 'round-title'"
                                        >
                                            <label>Timer (seconds)</label>
                                            <input
                                                type="number"
                                                x-model="currentQuiz.questions[selectedQuestionIndex].timer"
                                            />
                                        </div>
                                        <div
                                            class="input-group"
                                            x-show="currentQuiz.questions[selectedQuestionIndex].type !== 'round-title'"
                                        >
                                            <label>Tags (e.g. Australia, History)</label>
                                            <div style="display: flex; flex-direction: column; gap: 0.5rem">
                                                <div style="display: flex; flex-wrap: wrap; gap: 0.5rem">
                                                    <template x-for="tag in currentQuiz.questions[selectedQuestionIndex].tags" :key="tag">
                                                        <span 
                                                            class="text-sm" 
                                                            style="background: #f1f5f9; padding: 0.25rem 0.75rem; border-radius: var(--radius-full); font-weight: 700; color: var(--color-primary); display: flex; align-items: center; gap: 0.5rem;"
                                                        >
                                                            <span x-text="tag"></span>
                                                            <button @click="removeTag(tag)" style="background: none; border: none; padding: 0; cursor: pointer; color: var(--color-danger); font-weight: 800; font-size: 1rem;">×</button>
                                                        </span>
                                                    </template>
                                                </div>
                                                <div class="tag-input-container">
                                                    <input
                                                        type="text"
                                                        x-model="newTagInput"
                                                        placeholder="Add a tag and press Enter"
                                                        @input="updateTagSuggestions()"
                                                        @keydown.enter.prevent="addTag()"
                                                        @keydown.arrow-down.prevent="navigateTagSuggestions('down')"
                                                        @keydown.arrow-up.prevent="navigateTagSuggestions('up')"
                                                        @keydown.escape="tagSuggestions = []"
                                                        @blur="setTimeout(() => tagSuggestions = [], 200)"
                                                    />
                                                    <div class="tag-suggestions" x-show="tagSuggestions.length > 0">
                                                        <template x-for="(suggestion, sIdx) in tagSuggestions" :key="suggestion">
                                                            <div 
                                                                class="tag-suggestion-item"
                                                                :class="{ 'active': activeTagSuggestionIndex === sIdx }"
                                                                x-text="suggestion"
                                                                @click="selectTag(suggestion)"
                                                                @mouseenter="activeTagSuggestionIndex = sIdx"
                                                            ></div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div
                                        class="input-group"
                                        x-show="currentQuiz.questions[selectedQuestionIndex].type === 'round-title'"
                                    >
                                        <label>Round Title Text</label>
                                        <input
                                            type="text"
                                            x-model="currentQuiz.questions[selectedQuestionIndex].title"
                                            placeholder="e.g. Round 1: History"
                                            style="font-size: 1.125rem; font-weight: 700"
                                        />
                                    </div>

                                    <div
                                        class="input-group"
                                        x-show="currentQuiz.questions[selectedQuestionIndex].type === 'round-title'"
                                    >
                                        <label>Background Image URL (Optional)</label>
                                        <div style="display: flex; gap: 0.75rem">
                                            <input
                                                type="text"
                                                x-model="currentQuiz.questions[selectedQuestionIndex].image"
                                                placeholder="https://..."
                                                style="flex: 1"
                                            />
                                            <button
                                                class="btn btn-secondary"
                                                @click="$refs.roundFile.click()"
                                            >
                                                📁 Upload
                                            </button>
                                            <input
                                                type="file"
                                                x-ref="roundFile"
                                                style="display: none"
                                                accept="image/*"
                                                @change="uploadImage($event, 'image')"
                                            />
                                        </div>
                                    </div>

                                    <div
                                        class="input-group"
                                        x-show="currentQuiz.questions[selectedQuestionIndex].type !== 'round-title'"
                                    >
                                        <label>Question Text</label>
                                        <textarea
                                            x-model="currentQuiz.questions[selectedQuestionIndex].question"
                                            rows="3"
                                            style="font-size: 1.1rem; font-weight: 600"
                                        ></textarea>
                                    </div>

                                    <div
                                        class="input-group"
                                        x-show="currentQuiz.questions[selectedQuestionIndex].type !== 'round-title'"
                                    >
                                        <label>Image URL (Optional)</label>
                                        <div style="display: flex; gap: 0.75rem">
                                            <input
                                                type="text"
                                                x-model="currentQuiz.questions[selectedQuestionIndex].image"
                                                placeholder="https://..."
                                                style="flex: 1"
                                            />
                                            <button
                                                class="btn btn-secondary"
                                                @click="$refs.questionFile.click()"
                                            >
                                                📁 Upload
                                            </button>
                                            <input
                                                type="file"
                                                x-ref="questionFile"
                                                style="display: none"
                                                accept="image/*"
                                                @change="uploadImage($event, 'image')"
                                            />
                                        </div>
                                    </div>

                                    <!-- Options for Multiple Choice -->
                                    <div
                                        x-show="currentQuiz.questions[selectedQuestionIndex].type === 'multiple'"
                                        style="margin-bottom: 1.5rem"
                                    >
                                        <div
                                            style="
                                                display: flex;
                                                justify-content: space-between;
                                                align-items: center;
                                                margin-bottom: 0.75rem;
                                            "
                                        >
                                            <label style="margin: 0"
                                                >Options & Correct Answer</label
                                            >
                                            <button
                                                @click="autoGenerateOptions()"
                                                class="btn btn-secondary text-sm"
                                                style="padding: 0.25rem 0.75rem; border-color: #9333ea; color: #9333ea"
                                            >
                                                ✨ AI Generate Options
                                            </button>
                                        </div>
                                        <div class="options-grid">
                                            <template
                                                x-for="(opt, oIdx) in currentQuiz.questions[selectedQuestionIndex].options"
                                                :key="oIdx"
                                            >
                                                <div
                                                    class="mc-option-item"
                                                    :class="{ 'is-correct': currentQuiz.questions[selectedQuestionIndex].correctAnswer === currentQuiz.questions[selectedQuestionIndex].options[oIdx] }"
                                                >
                                                    <button
                                                        type="button"
                                                        class="mc-option-check"
                                                        @click="currentQuiz.questions[selectedQuestionIndex].correctAnswer = currentQuiz.questions[selectedQuestionIndex].options[oIdx]"
                                                        title="Set as correct answer"
                                                    >
                                                        ✓
                                                    </button>
                                                    <input
                                                        type="text"
                                                        class="mc-option-input"
                                                        :value="currentQuiz.questions[selectedQuestionIndex].options[oIdx]"
                                                        @input="
                                                            const newVal = $el.value;
                                                            const q = currentQuiz.questions[selectedQuestionIndex];
                                                            const oldVal = q.options[oIdx];
                                                            q.options[oIdx] = newVal;
                                                            if (q.type === 'multiple' && q.correctAnswer === oldVal) {
                                                                q.correctAnswer = newVal;
                                                            }
                                                        "
                                                        placeholder="Option Text"
                                                    />
                                                    <button 
                                                        type="button"
                                                        class="mc-option-delete"
                                                        @click="removeOption(oIdx)"
                                                        title="Remove Option"
                                                    >
                                                        🗑️
                                                    </button>
                                                </div>
                                            </template>
                                        </div>
                                        <div style="margin-top: 1rem">
                                            <button @click="addOption()" class="btn btn-secondary text-sm" style="width: 100%; border-style: dashed">+ Add Option</button>
                                        </div>
                                    </div>

                                    <!-- Options for Short Answer -->
                                    <div
                                        x-show="['short', 'identify'].includes(currentQuiz.questions[selectedQuestionIndex].type)"
                                    >
                                        <label>Accepted Answers (Comma separated)</label>
                                        <input
                                            type="text"
                                            placeholder="e.g. Answer 1, Answer 2"
                                            :value="Array.isArray(currentQuiz.questions[selectedQuestionIndex].correctAnswer) ? currentQuiz.questions[selectedQuestionIndex].correctAnswer.join(', ') : currentQuiz.questions[selectedQuestionIndex].correctAnswer"
                                            @input="currentQuiz.questions[selectedQuestionIndex].correctAnswer = $event.target.value.split(',').map(s => s.trim())"
                                        />
                                    </div>

                                    <div class="input-group" style="margin-top: 2rem" x-show="currentQuiz.questions[selectedQuestionIndex].type !== 'round-title'">
                                        <label>Host Notes (Optional)</label>
                                        <textarea
                                            x-model="currentQuiz.questions[selectedQuestionIndex].notes"
                                            rows="2"
                                            placeholder="Notes for the host during this question..."
                                            class="text-sm"
                                        ></textarea>
                                    </div>
                                </div>
                            </template>
                            <template x-if="!currentQuiz.questions[selectedQuestionIndex]">
                                <div style="text-align: center; padding: 5rem">
                                    <div style="font-size: 3rem; margin-bottom: 1rem">👈</div>
                                    <h3 class="text-muted">Select a slide to start editing</h3>
                                </div>
                            </template>
                        </div>
                    </div>
                <!-- Old template end removed -->

                <!-- Game Options Side Panel -->
                <div 
                    class="game-options-panel" 
                    x-show="showGameOptions"
                    x-transition:enter="transition ease-out duration-300"
                    x-transition:enter-start="translate-x-full"
                    x-transition:enter-end="translate-x-0"
                    x-transition:leave="transition ease-in duration-300"
                    x-transition:leave-start="translate-x-0"
                    x-transition:leave-end="translate-x-full"
                >
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem">
                        <h3 style="margin: 0">Game Options</h3>
                        <button @click="showGameOptions = false" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--color-text-muted)">&times;</button>
                    </div>

                    <p class="text-muted text-sm" style="margin-bottom: 1.5rem">
                        These settings apply to this specific quiz when hosted.
                    </p>

                    <div class="input-group">
                        <label>Default Timer (seconds)</label>
                        <input
                            type="number"
                            x-model.number="currentQuiz.settings.defaultTimer"
                            min="5"
                            step="5"
                        />
                        <p class="text-muted text-sm" style="margin-top: 0.25rem">
                            Fallback for slides with no specific timer.
                        </p>
                    </div>

                    <div class="card" style="background: var(--color-bg); margin-bottom: 1rem; border: none;">
                        <label style="display: flex; gap: 0.75rem; align-items: start; cursor: pointer; margin: 0;">
                            <input
                                type="checkbox"
                                x-model="currentQuiz.settings.speedScoring"
                                style="width: 1.25rem; height: 1.25rem; margin-top: 0.1rem;"
                            />
                            <div>
                                <span style="font-weight: 700; display: block;">Speed Scoring</span>
                                <span class="text-muted text-sm" style="font-weight: 400; line-height: 1.3; display: block; margin-top: 0.25rem;">
                                    Award bonus points for faster answers.
                                </span>
                            </div>
                        </label>
                    </div>

                    <div class="card" style="background: var(--color-bg); margin-bottom: 1rem; border: none;">
                        <label style="display: flex; gap: 0.75rem; align-items: start; cursor: pointer; margin: 0;">
                            <input
                                type="checkbox"
                                x-model="currentQuiz.settings.autoReveal"
                                style="width: 1.25rem; height: 1.25rem; margin-top: 0.1rem;"
                            />
                            <div>
                                <span style="font-weight: 700; display: block;">Auto-Reveal</span>
                                <span class="text-muted text-sm" style="font-weight: 400; line-height: 1.3; display: block; margin-top: 0.25rem;">
                                    Automatically show answers when everyone has answered.
                                </span>
                            </div>
                        </label>
                    </div>

                    <div class="card" style="background: var(--color-bg); margin-bottom: 1rem; border: none;">
                        <label style="display: flex; gap: 0.75rem; align-items: start; cursor: pointer; margin: 0;">
                            <input
                                type="checkbox"
                                x-model="currentQuiz.settings.continuousScoreboard"
                                style="width: 1.25rem; height: 1.25rem; margin-top: 0.1rem;"
                            />
                            <div>
                                <span style="font-weight: 700; display: block;">Continuous Scoreboard</span>
                                <span class="text-muted text-sm" style="font-weight: 400; line-height: 1.3; display: block; margin-top: 0.25rem;">
                                    If off, the scoreboard is only visible to players when you choose to show it.
                                </span>
                            </div>
                        </label>
                    </div>
                </div>
                <!-- Closing wrapper and template -->
                    </div>
                </template>
            </div>

            <!-- Settings Modal -->
            <div
                class="modal-backdrop"
                x-show="showSettings"
                x-cloak
                @click.self="showSettings = false"
            >
                <div class="modal-content">
                    <h2 style="margin-top: 0; color: var(--color-primary); margin-bottom: 1.5rem">⚙️ Editor Settings</h2>

                    <div class="input-group">
                        <label>Autosave Delay (ms)</label>
                        <input
                            type="number"
                            x-model.number="settings.autosaveDelay"
                            min="500"
                            step="500"
                        />
                        <p class="text-muted text-sm" style="margin-top: 0.5rem">
                            Time to wait after typing before saving.
                        </p>
                    </div>

                    <div class="input-group">
                        <label
                            style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer"
                        >
                            <input
                                type="checkbox"
                                x-model="settings.showQuestionNumbers"
                                style="width: 1.25rem; height: 1.25rem"
                            />
                            <span>Show Slide Numbers in Sidebar</span>
                        </label>
                    </div>

                    <div style="display: flex; gap: 0.75rem; margin-top: 2rem">
                        <button
                            @click="saveSettings()"
                            class="btn btn-primary"
                            style="flex: 1"
                        >
                            Save Settings
                        </button>
                        <button
                            @click="showSettings = false"
                            class="btn btn-secondary"
                            style="flex: 1"
                        >
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="../shared/version.js"></script>
        <script src="../shared/ui-components.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
        <script src="../config/firebase-config.js"></script>
        <script src="../shared/firebase-helper.js"></script>
        <script src="../shared/ai-helper.js"></script>
        <script src="editor-data.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

        <script>
            document.addEventListener('alpine:init', () => {
                const fb = TriviaFirebase.init();
                if (fb) {
                    Alpine.data('quizEditor', () =>
                        window.createEditorData(fb.firebase, fb.db, fb.auth, fb.storage)
                    );
                } else {
                    console.error('Firebase init failed in editor');
                }
            });

            document.addEventListener('DOMContentLoaded', () => {
                if (typeof displayVersion === 'function') {
                    displayVersion('app-version-editor');
                }
            });
        </script>
    </body>
</html>
