<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quiz Editor - Trivia Night</title>
        <link rel="stylesheet" href="../shared/styles.css?v=1.6" />
        <style>
            body {
                padding: 0;
                background: var(--color-bg);
            }
            .container {
                max-width: 1400px;
                margin: 0 auto;
                padding: 1.5rem;
            }
            .quiz-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem 0;
                border-bottom: 1px solid var(--color-border);
            }
            .quiz-item:last-child {
                border-bottom: none;
            }

            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 2rem;
            }

            /* Editor Layout */
            .editor-layout {
                display: flex;
                height: calc(100vh - 180px);
                gap: 1.5rem;
                margin-top: 1.5rem;
            }
            .sidebar {
                width: 300px;
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
                overflow-y: auto;
                padding-right: 0.5rem;
            }
            .slide-thumb {
                padding: 1rem;
                background: var(--color-surface);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                cursor: pointer;
                min-height: 100px;
                transition: all 0.2s;
                display: flex;
                flex-direction: column;
            }
            .slide-thumb.active {
                border-color: var(--color-primary);
                background: #f0f7ff;
                ring: 2px solid rgba(30, 64, 175, 0.1);
            }
            .slide-thumb:hover:not(.active) {
                border-color: var(--color-primary);
                background: var(--color-bg);
            }
            .slide-number {
                font-size: 0.75rem;
                color: var(--color-primary);
                font-weight: 800;
                margin-bottom: 0.5rem;
                letter-spacing: 0.05em;
            }
            .slide-preview {
                font-size: 0.875rem;
                font-weight: 600;
                color: var(--color-text);
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                line-height: 1.4;
            }

            .main-editor {
                flex: 1;
                overflow-y: auto;
                padding: 2.5rem;
                background: var(--color-surface);
                border-radius: var(--radius-lg);
                border: 1px solid var(--color-border);
                box-shadow: var(--shadow-sm);
            }

            /* Modal Styles */
            .modal-backdrop {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(15, 23, 42, 0.6);
                backdrop-filter: blur(4px);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 2000;
            }
            .modal-content {
                background: white;
                padding: 2.5rem;
                border-radius: var(--radius-lg);
                width: 100%;
                max-width: 440px;
                box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            }

            .input-group {
                margin-bottom: 1.25rem;
            }
            label {
                display: block;
                font-weight: 700;
                font-size: 0.875rem;
                margin-bottom: 0.5rem;
                color: var(--color-text);
            }

            .options-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem;
            }
        </style>
    </head>
    <body x-data="quizEditor">
        <div class="container" x-cloak>
            <div class="header" x-show="!editingQuizId">
                <div>
                    <h1>📝 Quiz Editor</h1>
                    <span
                        id="app-version"
                        class="text-muted"
                        style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em"
                    ></span>
                </div>
                <div style="display: flex; gap: 0.75rem">
                    <button
                        x-show="isAuthenticated"
                        @click="showSettings = true"
                        class="btn btn-secondary"
                    >
                        ⚙️ Settings
                    </button>
                    <a href="host.html" class="btn btn-secondary" style="text-decoration: none">← Back to Host</a>
                    <button
                        x-show="isAuthenticated"
                        @click="createNewQuiz()"
                        class="btn btn-success"
                    >
                        + Create New Quiz
                    </button>
                </div>
            </div>

            <div x-show="!isAuthenticated" class="card" style="text-align: center; max-width: 500px; margin: 4rem auto">
                <h2 style="margin-bottom: 0.5rem">Authentication Required</h2>
                <p class="text-muted" style="margin-bottom: 2rem">You must be logged in as a Host to access the editor.</p>
                <a href="host.html" class="btn btn-primary">Go to Host Panel</a>
            </div>

            <div x-show="isAuthenticated && !editingQuizId" class="card">
                <h3 style="margin-bottom: 1.5rem">Your Quizzes</h3>
                <div
                    x-show="Object.keys(quizzes).length === 0"
                    class="text-muted"
                    style="padding: 3rem; text-align: center; font-weight: 600"
                >
                    No quizzes found in your collection.
                </div>
                <template x-for="(quiz, id) in quizzes" :key="id">
                    <div class="quiz-item">
                        <div>
                            <strong
                                style="font-size: 1.125rem"
                                x-text="quiz.title || (quiz.questions && quiz.questions[0] ? quiz.questions[0].title : 'Untitled Quiz')"
                            ></strong>
                            <div
                                class="text-muted text-sm"
                                style="font-weight: 600; margin-top: 0.25rem"
                                x-text="(quiz.questions ? quiz.questions.length : 0) + ' items &bull; Updated ' + (quiz.updatedAt && typeof quiz.updatedAt === 'number' ? TriviaUI.formatDate(quiz.updatedAt) : 'Just now')"
                            ></div>
                        </div>
                        <div style="display: flex; gap: 0.5rem">
                            <button @click="editQuiz(id)" class="btn btn-primary">Edit</button>
                            <button @click="deleteQuiz(id)" class="btn btn-secondary" style="color: var(--color-danger)">Delete</button>
                        </div>
                    </div>
                </template>
            </div>

            <div x-show="editingQuizId" style="display: flex; flex-direction: column; height: 92vh">
                <div class="header" style="margin-bottom: 1rem">
                    <div style="display: flex; align-items: center; gap: 1rem; flex: 1">
                        <button
                            @click="closeEditor()"
                            class="btn btn-secondary"
                            style="padding: 0.5rem 0.75rem"
                        >
                            ← Back
                        </button>
                        <input
                            type="text"
                            x-model="currentQuiz.title"
                            style="
                                font-size: 1.25rem;
                                font-weight: 800;
                                border: none;
                                background: transparent;
                                padding: 0.25rem 0.5rem;
                                border-radius: var(--radius-md);
                                width: auto;
                                flex: 1;
                                max-width: 600px;
                            "
                            onfocus="this.style.background = 'white'; this.style.boxShadow = 'var(--shadow-sm)'"
                            onblur="this.style.background = 'transparent'; this.style.boxShadow = 'none'"
                        />
                    </div>
                    <div style="display: flex; gap: 0.75rem; align-items: center">
                        <div
                            x-show="statusMsg"
                            class="text-sm"
                            style="
                                padding: 0.375rem 0.75rem;
                                border-radius: var(--radius-full);
                                font-weight: 700;
                            "
                            :style="statusMsg.includes('⚠️') ? 'background: #fff7ed; color: var(--color-warning);' : (statusMsg.includes('❌') ? 'background: #fef2f2; color: var(--color-danger);' : 'background: #f0fdf4; color: var(--color-success);')"
                            x-text="statusMsg"
                        ></div>
                    </div>
                </div>

                <template x-if="currentQuiz">
                    <div class="editor-layout">
                        <!-- Sidebar: Question List -->
                        <div class="sidebar">
                            <div id="slide-list-container" style="display: flex; flex-direction: column; gap: 0.5rem">
                                <template x-for="(q, index) in currentQuiz.questions" :key="q.id">
                                    <div
                                        class="slide-thumb"
                                        :data-id="q.id"
                                        :class="{ 'active': selectedQuestionIndex === index }"
                                        @click="selectQuestion(index)"
                                    >
                                        <div
                                            class="slide-number"
                                            x-show="settings.showQuestionNumbers"
                                            x-text="q.type === 'round-title' ? 'ROUND ' + q.roundNumber : 'QUESTION ' + q.questionNumber"
                                        ></div>
                                        <div
                                            class="slide-preview"
                                            x-text="q.type === 'round-title' ? q.title : (q.question || '(New Question)')"
                                        ></div>
                                        <div
                                            class="text-muted"
                                            style="margin-top: auto; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em"
                                            x-text="currentQuiz.questions[index].type === 'multiple' ? 'Multiple Choice' : (currentQuiz.questions[index].type === 'short' ? 'Short Answer' : (currentQuiz.questions[index].type === 'true-false' ? 'True / False' : (currentQuiz.questions[index].type === 'identify' ? 'Identify' : 'Round Intro')))"
                                        ></div>
                                    </div>
                                </template>
                            </div>
                            <div style="display: flex; gap: 0.5rem; margin-top: 1rem; position: sticky; bottom: 0; background: var(--color-bg); padding-top: 0.5rem">
                                <button
                                    @click="addQuestion()"
                                    class="btn btn-primary"
                                    style="flex: 1"
                                >
                                    + Question
                                </button>
                                <button
                                    @click="addRound()"
                                    class="btn btn-secondary"
                                    style="flex: 1"
                                >
                                    + Round
                                </button>
                            </div>
                        </div>

                        <!-- Main Area: Current Question Editor -->
                        <div class="main-editor">
                            <template x-if="currentQuiz.questions[selectedQuestionIndex]">
                                <div>
                                    <div
                                        style="
                                            display: flex;
                                            justify-content: space-between;
                                            align-items: center;
                                            margin-bottom: 2rem;
                                            padding-bottom: 1rem;
                                            border-bottom: 1px solid var(--color-border);
                                        "
                                    >
                                        <h2
                                            style="margin: 0; color: var(--color-primary); font-size: 1.25rem"
                                            x-text="(currentQuiz.questions[selectedQuestionIndex].type === 'round-title' ? 'Round Intro ' + currentQuiz.questions[selectedQuestionIndex].roundNumber : 'Question ' + currentQuiz.questions[selectedQuestionIndex].questionNumber)"
                                        ></h2>
                                        <button
                                            @click="removeQuestion(selectedQuestionIndex)"
                                            class="btn btn-secondary"
                                            style="color: var(--color-danger); border-color: transparent"
                                        >
                                            Delete Slide
                                        </button>
                                    </div>

                                    <div
                                        style="
                                            display: grid;
                                            grid-template-columns: 1fr 1fr 1fr;
                                            gap: 1.25rem;
                                        "
                                    >
                                        <div class="input-group">
                                            <label>Slide Type</label>
                                            <select
                                                x-model="currentQuiz.questions[selectedQuestionIndex].type"
                                            >
                                                <option value="multiple">Multiple Choice</option>
                                                <option value="short">Short Answer</option>
                                                <option value="true-false">True / False</option>
                                                <option value="identify">Identify (Picture)</option>
                                                <option value="round-title">
                                                    Round Title (Intro)
                                                </option>
                                            </select>
                                        </div>
                                        <div
                                            class="input-group"
                                            x-show="currentQuiz.questions[selectedQuestionIndex].type !== 'round-title'"
                                        >
                                            <label>Timer (seconds)</label>
                                            <input
                                                type="number"
                                                x-model="currentQuiz.questions[selectedQuestionIndex].timer"
                                            />
                                        </div>
                                        <div
                                            class="input-group"
                                            x-show="currentQuiz.questions[selectedQuestionIndex].type !== 'round-title'"
                                        >
                                            <label>Tags (e.g. Australia, History)</label>
                                            <div style="display: flex; flex-direction: column; gap: 0.5rem">
                                                <div style="display: flex; flex-wrap: wrap; gap: 0.5rem">
                                                    <template x-for="tag in currentQuiz.questions[selectedQuestionIndex].tags" :key="tag">
                                                        <span 
                                                            class="text-sm" 
                                                            style="background: #f1f5f9; padding: 0.25rem 0.75rem; border-radius: var(--radius-full); font-weight: 700; color: var(--color-primary); display: flex; align-items: center; gap: 0.5rem;"
                                                        >
                                                            <span x-text="tag"></span>
                                                            <button @click="removeTag(tag)" style="background: none; border: none; padding: 0; cursor: pointer; color: var(--color-danger); font-weight: 800; font-size: 1rem;">×</button>
                                                        </span>
                                                    </template>
                                                </div>
                                                <input
                                                    type="text"
                                                    x-model="newTagInput"
                                                    placeholder="Add a tag and press Enter"
                                                    @keydown.enter.prevent="addTag()"
                                                    @blur="addTag()"
                                                />
                                            </div>
                                        </div>
                                    </div>

                                    <div
                                        class="input-group"
                                        x-show="currentQuiz.questions[selectedQuestionIndex].type === 'round-title'"
                                    >
                                        <label>Round Title Text</label>
                                        <input
                                            type="text"
                                            x-model="currentQuiz.questions[selectedQuestionIndex].title"
                                            placeholder="e.g. Round 1: History"
                                            style="font-size: 1.125rem; font-weight: 700"
                                        />
                                    </div>

                                    <div
                                        class="input-group"
                                        x-show="currentQuiz.questions[selectedQuestionIndex].type === 'round-title'"
                                    >
                                        <label>Background Image URL (Optional)</label>
                                        <div style="display: flex; gap: 0.75rem">
                                            <input
                                                type="text"
                                                x-model="currentQuiz.questions[selectedQuestionIndex].image"
                                                placeholder="https://..."
                                                style="flex: 1"
                                            />
                                            <button
                                                class="btn btn-secondary"
                                                @click="$refs.roundFile.click()"
                                            >
                                                📁 Upload
                                            </button>
                                            <input
                                                type="file"
                                                x-ref="roundFile"
                                                style="display: none"
                                                accept="image/*"
                                                @change="uploadImage($event, 'image')"
                                            />
                                        </div>
                                    </div>

                                    <div
                                        class="input-group"
                                        x-show="currentQuiz.questions[selectedQuestionIndex].type !== 'round-title'"
                                    >
                                        <label>Question Text</label>
                                        <textarea
                                            x-model="currentQuiz.questions[selectedQuestionIndex].question"
                                            rows="3"
                                            style="font-size: 1.1rem; font-weight: 600"
                                        ></textarea>
                                    </div>

                                    <div
                                        class="input-group"
                                        x-show="currentQuiz.questions[selectedQuestionIndex].type !== 'round-title'"
                                    >
                                        <label>Image URL (Optional)</label>
                                        <div style="display: flex; gap: 0.75rem">
                                            <input
                                                type="text"
                                                x-model="currentQuiz.questions[selectedQuestionIndex].image"
                                                placeholder="https://..."
                                                style="flex: 1"
                                            />
                                            <button
                                                class="btn btn-secondary"
                                                @click="$refs.questionFile.click()"
                                            >
                                                📁 Upload
                                            </button>
                                            <input
                                                type="file"
                                                x-ref="questionFile"
                                                style="display: none"
                                                accept="image/*"
                                                @change="uploadImage($event, 'image')"
                                            />
                                        </div>
                                    </div>

                                    <!-- Options for Multiple Choice -->
                                    <div
                                        x-show="currentQuiz.questions[selectedQuestionIndex].type === 'multiple'"
                                        style="margin-bottom: 1.5rem"
                                    >
                                        <div
                                            style="
                                                display: flex;
                                                justify-content: space-between;
                                                align-items: center;
                                                margin-bottom: 0.75rem;
                                            "
                                        >
                                            <label style="margin: 0"
                                                >Options & Correct Answer</label
                                            >
                                            <button
                                                @click="autoGenerateOptions()"
                                                class="btn btn-secondary text-sm"
                                                style="padding: 0.25rem 0.75rem; border-color: #9333ea; color: #9333ea"
                                            >
                                                ✨ AI Generate Options
                                            </button>
                                        </div>
                                        <div class="options-grid">
                                            <template
                                                x-for="(opt, oIdx) in currentQuiz.questions[selectedQuestionIndex].options"
                                                :key="oIdx"
                                            >
                                                <div
                                                    style="
                                                        display: flex;
                                                        gap: 0.75rem;
                                                        align-items: center;
                                                        background: var(--color-bg);
                                                        padding: 0.75rem;
                                                        border-radius: var(--radius-md);
                                                        border: 1px solid var(--color-border);
                                                    "
                                                >
                                                    <input
                                                        type="radio"
                                                        :name="'correct-' + selectedQuestionIndex"
                                                        :value="currentQuiz.questions[selectedQuestionIndex].options[oIdx]"
                                                        x-model="currentQuiz.questions[selectedQuestionIndex].correctAnswer"
                                                        style="width: 1rem; height: 1rem"
                                                    />
                                                    <input
                                                        type="text"
                                                        x-model="currentQuiz.questions[selectedQuestionIndex].options[oIdx]"
                                                        placeholder="Option Text"
                                                        style="
                                                            border: none;
                                                            background: transparent;
                                                            padding: 0;
                                                            font-weight: 600;
                                                        "
                                                    />
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- Options for Short Answer -->
                                    <div
                                        x-show="['short', 'identify'].includes(currentQuiz.questions[selectedQuestionIndex].type)"
                                    >
                                        <label>Accepted Answers (Comma separated)</label>
                                        <input
                                            type="text"
                                            placeholder="e.g. Answer 1, Answer 2"
                                            :value="Array.isArray(currentQuiz.questions[selectedQuestionIndex].correctAnswer) ? currentQuiz.questions[selectedQuestionIndex].correctAnswer.join(', ') : currentQuiz.questions[selectedQuestionIndex].correctAnswer"
                                            @input="currentQuiz.questions[selectedQuestionIndex].correctAnswer = $event.target.value.split(',').map(s => s.trim())"
                                        />
                                    </div>

                                    <div class="input-group" style="margin-top: 2rem">
                                        <label>Host Notes (Optional)</label>
                                        <textarea
                                            x-model="currentQuiz.questions[selectedQuestionIndex].notes"
                                            rows="2"
                                            placeholder="Notes for the host during this question..."
                                            class="text-sm"
                                        ></textarea>
                                    </div>
                                </div>
                            </template>
                            <template x-if="!currentQuiz.questions[selectedQuestionIndex]">
                                <div style="text-align: center; padding: 5rem">
                                    <div style="font-size: 3rem; margin-bottom: 1rem">👈</div>
                                    <h3 class="text-muted">Select a slide to start editing</h3>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Settings Modal -->
            <div
                class="modal-backdrop"
                x-show="showSettings"
                x-cloak
                @click.self="showSettings = false"
            >
                <div class="modal-content">
                    <h2 style="margin-top: 0; color: var(--color-primary); margin-bottom: 1.5rem">⚙️ Editor Settings</h2>

                    <div class="input-group">
                        <label>Autosave Delay (ms)</label>
                        <input
                            type="number"
                            x-model.number="settings.autosaveDelay"
                            min="500"
                            step="500"
                        />
                        <p class="text-muted text-sm" style="margin-top: 0.5rem">
                            Time to wait after typing before saving.
                        </p>
                    </div>

                    <div class="input-group">
                        <label
                            style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer"
                        >
                            <input
                                type="checkbox"
                                x-model="settings.showQuestionNumbers"
                                style="width: 1.25rem; height: 1.25rem"
                            />
                            <span>Show Slide Numbers in Sidebar</span>
                        </label>
                    </div>

                    <div style="display: flex; gap: 0.75rem; margin-top: 2rem">
                        <button
                            @click="saveSettings()"
                            class="btn btn-primary"
                            style="flex: 1"
                        >
                            Save Settings
                        </button>
                        <button
                            @click="showSettings = false"
                            class="btn btn-secondary"
                            style="flex: 1"
                        >
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="../shared/version.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
        <script src="../config/firebase-config.js"></script>
        <script src="../shared/firebase-helper.js"></script>
        <script src="../shared/ai-helper.js"></script>
        <script src="editor-data.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

        <script>
            document.addEventListener('alpine:init', () => {
                const fb = TriviaFirebase.init();
                if (fb) {
                    Alpine.data('quizEditor', () =>
                        window.createEditorData(fb.firebase, fb.db, fb.auth, fb.storage)
                    );
                } else {
                    console.error('Firebase init failed in editor');
                }
            });

            document.addEventListener('DOMContentLoaded', () => {
                if (typeof displayVersion === 'function') displayVersion('app-version');
            });
        </script>
    </body>
</html>
